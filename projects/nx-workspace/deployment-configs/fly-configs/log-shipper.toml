# Org-wide log forwarder: superfly/fly-log-shipper (Vector) subscribes to the
# Fly NATS log stream for every app in the org and pushes to Loki on the
# observability VM (aws-grafana.tf). One app covers staging and production;
# the Loki label fly_app_name tells them apart. Deployed by
# `pnpm logs:shipper:deploy`, which stages ACCESS_TOKEN / LOKI_PASSWORD from
# Vault first. No public IPs: it only dials out.
#
# `vb-log-shipper`, not `log-shipper`: fly app names are globally unique
# across all of Fly.io, and the bare name is already held by someone else.
app = 'vb-log-shipper'
primary_region = 'yyz'

[build]
  image = 'flyio/log-shipper:latest'

[env]
  ORG = 'personal'
  SUBJECT = 'logs.>'
  LOKI_URL = 'https://loki.harryliu.dev'
  LOKI_USERNAME = 'fly-log-shipper'

# No [[services]] block at all. The shipper only dials out (NATS in from Fly's
# log stream, HTTPS out to Loki), so it needs no ingress; declaring a service
# with no ports both trips fly's deprecation check and makes it allocate a
# public shared v4 and dedicated v6 on first deploy. Vector's API on 8686 stays
# reachable over 6PN for debugging without any public edge.

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
