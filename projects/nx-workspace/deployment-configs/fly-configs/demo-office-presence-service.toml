app = 'demo-office-presence-service'
primary_region = 'yyz'

[build]
  image = 'iamharryliu/office-presence-socket-server-demo:latest'

[env]
  PORT = '3000'
  HOST = '0.0.0.0'
  SLACK_MODE = 'http'
  DEMO_MODE = 'true'
  DEMO_UI_ORIGIN = 'https://demo-office-presence-ui.pages.dev'
  OFFICE_PRESENCE_DB = '/data/state.db'
  # Seed week, seeded members' "today" and the fallback when a member's Slack timezone is unknown.
  REMINDER_TIMEZONE = 'America/Toronto'

[mounts]
  source = 'office_presence_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # Slack waits 3s for the ack; a suspended machine resumes in well under a second, but a stop-start
  # cold boot would miss it. Raise to 1 to keep the machine always warm (costs the free allowance).
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
