<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Text Tools | Harry Liu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      body {
        background-color: light-dark(#ffffff, #020617);
      }
    </style>
    <script>
      try {
        var theme = localStorage.getItem('text-tools-ui-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.style.colorScheme = theme;
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Convert and inspect text: JSON, environment variables, Base64, URL encoding and word counts."
    />
    <link rel="canonical" href="https://text-tools.harryliu.dev" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
