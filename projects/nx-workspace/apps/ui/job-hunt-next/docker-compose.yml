# Started by `nx run job-hunt-next:docker:up`, which builds the app
# first. Settings come from `.env` next to this file (see .env.example).
services:
  job-hunt:
    build:
      context: ../../..
      dockerfile: apps/ui/job-hunt-next/Dockerfile
    image: job-hunt-next
    container_name: job-hunt-next
    restart: unless-stopped
    init: true
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      - JOB_HUNT_MODEL
      - JOB_HUNT_FRAME_ANCESTORS
    ports:
      - '127.0.0.1:${JOB_HUNT_PORT:-4300}:3000'
    volumes:
      - '${JOB_APPLICATIONS_DIR:-${HOME}/Desktop/Job Applications}:/data'
      # A path bind-mounts your own career-experience.md and resume.json; unset,
      # the named volume starts from the sample profile.
      - '${CAREER_DIR:-career}:/career'
      - state:/state

volumes:
  career:
  state:
