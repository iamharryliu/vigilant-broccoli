# Layered on docker-compose.yml by `nx run job-applications-next:docker:up:repo-files`
# so the container edits this repo's own resume.json and career notes in place.
# Paths resolve from docker-compose.yml's directory.
services:
  job-applications:
    environment:
      - CAREER_EXPERIENCE_PATH=/career-files/career-experience.md
      - RESUME_PATH=/career-files/resume.json
      # vb-manager-next's Job Hunt page embeds the app.
      - JOB_APPLICATIONS_FRAME_ANCESTORS='self' https://manager.vigilant-broccoli.app
    volumes:
      - ../../../../../notes/personal/personal-software-career-experience.md:/career-files/career-experience.md
      - ../../../libs/@vigilant-broccoli/resume/src/resume.json:/career-files/resume.json
