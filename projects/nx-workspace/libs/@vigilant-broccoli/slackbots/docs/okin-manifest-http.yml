display_information:
  name: OK-IN
  background_color: '#000000'
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: OK-IN
    always_online: false
  slash_commands:
    - command: /preview-reminder
      description: Preview the reminder message that would be sent to you
      should_escape: false
      url: https://demo-office-presence-service.fly.dev/slack/commands
oauth_config:
  scopes:
    bot:
      - commands
      - channels:read
      - channels:write.invites
      - chat:write
      - users:read
      - im:write
      - groups:write
      - mpim:write
      - channels:write.topic
settings:
  event_subscriptions:
    request_url: https://demo-office-presence-service.fly.dev/slack/events
    bot_events:
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://demo-office-presence-service.fly.dev/slack/interactivity
  org_deploy_enabled: true
  socket_mode_enabled: false
  token_rotation_enabled: false
