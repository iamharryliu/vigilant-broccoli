name: cron-agentic-pr-create-prune

# Sweeps the whole tree for dead code, unused dependencies and stale or broken
# documentation, and opens one conservative PR removing only what has zero
# verified references. Same container and credentials as
# `cron-agentic-pr-create-todo-audit`; the local equivalent is
# `pnpm agentic-pr-create-prune`. Per-change cleanup only sees its own diff, so
# code orphaned by a later change elsewhere is never revisited without this.
#
# A clean run opens no PR and still succeeds: the runner prints PRUNE_CLEAN
# and exits 0.

on:
  schedule:
    - cron: '5 5 * * 0'
  workflow_dispatch:
    inputs:
      model:
        description: 'Claude model to run the agent with.'
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus
          - haiku
      firewall:
        description: 'In-container egress firewall (turn off if iptables/ipset fails on the runner).'
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'

permissions:
  contents: read
  id-token: write

# Static group: two overlapping sweeps would open competing PRs deleting the
# same files, and a half-finished run's pushed branch is not something a newer
# run should cancel out from under.
concurrency:
  group: cron-agentic-pr-create-prune
  cancel-in-progress: false

jobs:
  overview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      model: ${{ steps.config.outputs.model }}
      firewall: ${{ steps.config.outputs.firewall }}
    steps:
      # Scheduled runs carry no inputs, so the defaults are resolved once here
      # and both the overview and the prune job read the same values.
      - name: Resolve effective configuration
        id: config
        env:
          MODEL: ${{ inputs.model || 'sonnet' }}
          FIREWALL: ${{ inputs.firewall || 'on' }}
        run: |
          set -euo pipefail
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "firewall=$FIREWALL" >> "$GITHUB_OUTPUT"

      - name: Checkout summary helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: Publish overview
        continue-on-error: true
        uses: ./.github/actions/agentic-summary
        with:
          mode: overview
          title: Prune dead code and stale documentation
          agent: claude
          model: ${{ steps.config.outputs.model }}
          firewall: ${{ steps.config.outputs.firewall }}
          description: Sweep the whole repository for dead code, unused dependencies and stale or broken documentation, and remove only what has verifiably zero references. Opens a pull request only when something is removed.

  prune:
    needs: overview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;
            kv/data/secrets AGENT_GH_APP_ID | AGENT_GH_APP_ID ;
            kv/data/secrets AGENT_GH_APP_PRIVATE_KEY | AGENT_GH_APP_PRIVATE_KEY ;

      - name: Prune dead code and stale docs
        id: prune
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_APP_ID: ${{ env.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ env.AGENT_GH_APP_PRIVATE_KEY }}
          SANDBOX_FIREWALL: ${{ needs.overview.outputs.firewall }}
          MODEL: ${{ needs.overview.outputs.model }}
        run: |
          set -euo pipefail
          bash infrastructure/agent-sandbox/prune.sh --model "$MODEL"

      - name: Report result when the prune could not
        if: ${{ always() && steps.prune.outcome != 'success' && steps.prune.outputs.result_reported != 'true' }}
        uses: ./.github/actions/agentic-summary
        with:
          mode: result
          outcome: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
          note: ${{ steps.prune.outcome == 'skipped' && 'A step before the prune failed, so the agent never started.' || 'The prune stopped before it could report a result; see its step log.' }}
