name: test-security-api

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        type: choice
        default: all
        options:
          - all
          - staging
          - production

permissions:
  contents: read

jobs:
  security-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["staging", "production"]') }}
        service:
          # llm-service, storage-service, vb-email-service, and
          # email-subscription-service are private-only (no public fly.dev edge);
          # their no-key/wrong-key auth checks run over the flycast tunnel in
          # test-security-llm.yml, test-security-storage-service.yml,
          # test-security-email.yml, and test-security-email-subscription-service.yml
          - vb-express
    name: ${{ matrix.environment }}-${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run security check for ${{ matrix.environment }}-${{ matrix.service }}
        run: |
          chmod +x scripts/shell/test-api-ping-security.sh
          scripts/shell/test-api-ping-security.sh "${{ matrix.environment }}-${{ matrix.service }}" "https://${{ matrix.environment }}-${{ matrix.service }}.fly.dev"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Security check failed for ${{ matrix.environment }}-${{ matrix.service }}! /api/* may be accepting unauthorized requests."
          exit 1
