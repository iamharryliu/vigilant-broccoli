name: manual-agentic-pr-create-todo

on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Request to refine into one researched TODO.md row and pull request.'
        required: true
        type: string
      model:
        description: 'Claude model to refine the request with.'
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus
          - haiku
      firewall:
        description: 'In-container egress firewall (turn off if iptables/ipset fails on the runner).'
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'

permissions:
  contents: read
  id-token: write

# Queued rather than cancelled: concurrent runs would each append a row and
# conflict on TODO.md.
concurrency:
  group: manual-agentic-pr-create-todo
  cancel-in-progress: false

jobs:
  overview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout summary helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: Publish overview
        continue-on-error: true
        uses: ./.github/actions/agentic-summary
        with:
          mode: overview
          title: Create a TODO entry and a pull request
          agent: claude
          model: ${{ inputs.model }}
          firewall: ${{ inputs.firewall }}
          description: Refine the request using repo research and open a pull request adding one row to TODO.md.
          task_label: Request
          task: ${{ inputs.description }}

      - name: Validate description
        env:
          DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DESCRIPTION" | grep -q '[^[:space:]]'; then
            echo "ERROR: 'description' must contain a request." >&2
            exit 1
          fi

  create:
    needs: overview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;
            kv/data/secrets AGENT_GH_APP_ID | AGENT_GH_APP_ID ;
            kv/data/secrets AGENT_GH_APP_PRIVATE_KEY | AGENT_GH_APP_PRIVATE_KEY ;

      - name: Create TODO entry and open pull request
        id: create
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_APP_ID: ${{ env.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ env.AGENT_GH_APP_PRIVATE_KEY }}
          SANDBOX_FIREWALL: ${{ inputs.firewall }}
          MODEL: ${{ inputs.model }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail
          bash infrastructure/agent-sandbox/create-todo.sh --model "$MODEL" "$DESCRIPTION"

      - name: Report result when the TODO creation could not
        if: ${{ always() && steps.create.outcome != 'success' && steps.create.outputs.result_reported != 'true' }}
        uses: ./.github/actions/agentic-summary
        with:
          mode: result
          outcome: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
          note: ${{ steps.create.outcome == 'skipped' && 'A step before the TODO creation failed, so the agent never started.' || 'The TODO creation stopped before it could report a result; see its step log.' }}
