name: deploy-demo-apps

on:
  repository_dispatch:
    types: [deploy-fanout]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-demo-apps
  cancel-in-progress: false

jobs:
  employee-handler-ui:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.client_payload.conclusion == 'success' && github.event.client_payload.deployed == 'true' && github.event.client_payload.environment == 'staging') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nx-workspace

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          export_token: 'true'

      - name: Fetch Cloudflare Access service token from Secret Manager
        id: cf-access
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        with:
          secrets: |-
            CF_ACCESS_CLIENT_ID:vigilant-broccoli/VAULT_CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET:vigilant-broccoli/VAULT_CF_ACCESS_CLIENT_SECRET

      - name: Deploy affected demo apps
        working-directory: ./projects/nx-workspace
        env:
          VAULT_TOKEN: ${{ env.VAULT_TOKEN }}
          VAULT_ADDR: https://vault.harryliu.dev
          CF_ACCESS_CLIENT_ID: ${{ steps.cf-access.outputs.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ steps.cf-access.outputs.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm exec nx affected -t deploy:demo

      - name: Summarize deployed apps
        if: success()
        working-directory: ./projects/nx-workspace
        env:
          DEPLOY_ENVIRONMENT: demo
        run: |
          DEPLOY_PROJECTS=$(pnpm exec nx show projects --affected --withTarget=deploy:demo | tr '\n' ',') \
            node ../../.github/scripts/deploy-summary.mjs
