name: cron-security-news-digest

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cron-security-news-digest
  cancel-in-progress: true

jobs:
  security-news-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EMAIL_URL: http://127.0.0.1:3001/api/send-email
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SHARED_APP_TOKEN | SHARED_APP_TOKEN ;
            kv/data/secrets FLY_API_TOKEN | FLY_API_TOKEN ;

      - name: Tunnel to email service
        uses: ./.github/actions/fly-private-tunnel
        with:
          app: staging-vb-email-service
          local_port: '3001'

      - name: Fetch feeds and send digest when qualifying items exist
        run: node .github/scripts/security-news-digest.mjs
