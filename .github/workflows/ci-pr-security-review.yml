name: ci-pr-security-review

# Advisory before-merge review of each PR to main: a deterministic high-risk
# path pre-pass plus a read-only Claude verdict. Only a high or critical
# verdict acts: a structured marker comment (no model text) and an email with
# the details to the owner. Not a required check.
#
# Trust boundary: workflow_run always runs this file from the default branch
# (OIDC ref refs/heads/main), so a PR cannot edit the reviewer, and the shared
# main-bound Vault role is safe here. The PR is fetched as data through the API
# and never checked out or executed. Never switch this to pull_request or
# pull_request_target. See docs/infrastructure/secret-management.md.
#
# The repo is public, so logs, summaries and comments are world-readable: the
# model's text stays in a file in the review job and goes only to the email.
# Never pass it through step env, job outputs or echo.

on:
  workflow_run:
    workflows: [ci-pr-check]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ci-pr-security-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  MODEL: sonnet

jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      status: ${{ steps.collect.outputs.status }}
      pr: ${{ steps.collect.outputs.pr }}
      meta: ${{ steps.collect.outputs.meta }}
      severity: ${{ steps.review.outputs.severity }}
      flagged: ${{ steps.review.outputs.flagged }}
      email: ${{ steps.email.outcome }}
    steps:
      # main, not the PR head: Claude reads it for context. No persisted
      # credentials, so .git/config holds no token for it to read.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: repo
          persist-credentials: false

      - name: Collect PR diff and high-risk paths
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORK_DIR: ${{ runner.temp }}/pr-security-review
        run: bash repo/.github/scripts/review-pr-security.sh collect

      - name: Note skipped review
        if: steps.collect.outputs.status == 'no-pr' || steps.collect.outputs.status == 'already-reviewed'
        env:
          STATUS: ${{ steps.collect.outputs.status }}
        run: echo "PR security review skipped ($STATUS)." >> "$GITHUB_STEP_SUMMARY"

      - name: Import Claude Secrets from Vault
        if: steps.collect.outputs.status == 'review'
        uses: ./repo/.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.collect.outputs.status == 'review'
        with:
          node-version-file: repo/.nvmrc

      # Exact pin at or above the agent sandbox image's floor (>=2.1.277); the
      # file-tool confinement in review-pr-security.sh was verified on it.
      - name: Install Claude Code
        if: steps.collect.outputs.status == 'review'
        run: npm install -g '@anthropic-ai/claude-code@2.1.311'

      - name: Review diff
        id: review
        if: steps.collect.outputs.status == 'review'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          WORK_DIR: ${{ runner.temp }}/pr-security-review
          REPO_DIR: ${{ github.workspace }}/repo
        run: bash repo/.github/scripts/review-pr-security.sh review

      # The email steps stay in this job, after Claude has exited, because
      # the verdict file must not cross a job boundary (outputs end up in the
      # public log as step env).
      - name: Import email Secrets from Vault
        if: steps.review.outputs.notify == 'true'
        uses: ./repo/.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SHARED_APP_TOKEN | SHARED_APP_TOKEN ;
            kv/data/secrets FLY_API_TOKEN | FLY_API_TOKEN ;

      - name: Tunnel to email service
        if: steps.review.outputs.notify == 'true'
        uses: ./repo/.github/actions/fly-private-tunnel
        with:
          app: staging-vb-email-service

      # The report job fails the run on a failed send, after commenting.
      - name: Email security alert
        id: email
        if: steps.review.outputs.notify == 'true'
        continue-on-error: true
        env:
          SHARED_APP_TOKEN: ${{ env.SHARED_APP_TOKEN }}
          PR: ${{ steps.collect.outputs.pr }}
          META: ${{ steps.collect.outputs.meta }}
          VERDICT_FILE: ${{ runner.temp }}/pr-security-review/verdict.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node repo/.github/scripts/pr-security-review-email.mjs

  report:
    needs: review
    if: ${{ !cancelled() && (needs.review.outputs.status == 'review' || needs.review.outputs.status == 'docs-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout report script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          sparse-checkout: .github
          persist-credentials: false

      # Comments only on high or critical (or to clear an older head's alert).
      # Fails the run on a missing verdict or a failed alert email.
      - name: Write summary and PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STATUS: ${{ needs.review.outputs.status }}
          PR: ${{ needs.review.outputs.pr }}
          META: ${{ needs.review.outputs.meta }}
          SEVERITY: ${{ needs.review.outputs.severity }}
          FLAGGED: ${{ needs.review.outputs.flagged }}
          EMAIL_RESULT: ${{ needs.review.outputs.email }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/review-pr-security.sh report
