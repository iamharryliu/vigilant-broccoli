name: test-smoke-email-service

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        type: choice
        default: all
        options:
          - all
          - staging
          - production
  repository_dispatch:
    types: [deploy-fanout]

permissions:
  contents: read
  id-token: write

jobs:
  test-email-service:
    if: ${{ github.event_name != 'repository_dispatch' || (github.event.client_payload.conclusion == 'success' && github.event.client_payload.deployed == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'repository_dispatch' && format('["{0}"]', github.event.client_payload.environment) || inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["staging", "production"]') }}
    name: ${{ matrix.environment }}
    env:
      SERVICE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SHARED_APP_TOKEN | SHARED_APP_TOKEN ;
            kv/data/secrets FLY_API_TOKEN | FLY_API_TOKEN ;

      - uses: ./.github/actions/fly-private-tunnel
        with:
          app: ${{ matrix.environment }}-vb-email-service

      - name: Test email service
        env:
          SHARED_APP_TOKEN: ${{ env.SHARED_APP_TOKEN }}
        run: |
          STATUS=$(curl -s -o /tmp/response.json -w '%{http_code}' \
            -X POST ${{ env.SERVICE_URL }}/api/queue-emails \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${SHARED_APP_TOKEN}" \
            -d '[{"from":"Harry Liu <ci-test@harryliu.dev>","to":"harryliu1995@gmail.com","subject":"ci-test: Email Service Test","html":"<p>Automated test from GitHub Actions.</p>"}]')
          echo "Response status: $STATUS"
          cat /tmp/response.json
          if [ "$STATUS" = "200" ]; then
            echo "✓ Email service test passed"
          else
            echo "✗ Email service test failed"
            exit 1
          fi
