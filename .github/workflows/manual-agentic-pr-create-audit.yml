name: manual-agentic-pr-create-audit

# Audits the documentation for passages about legacy implementations that no
# longer apply to the current codebase, and opens one PR of at most 15 files
# removing or rewriting them. Same container and credentials as
# `cron-agentic-pr-create-prune`; the local equivalent is
# `pnpm agentic-pr-create-audit`. Dispatch-only: what counts as stale history
# is a judgement call worth asking for, not a sweep worth scheduling.
#
# A clean run opens no PR and still succeeds: the runner prints AUDIT_CLEAN
# and exits 0.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Claude model to run the agent with.'
        type: choice
        default: opus
        options:
          - opus
          - sonnet
          - haiku
      firewall:
        description: 'In-container egress firewall (turn off if iptables/ipset fails on the runner).'
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'

env:
  RUN_DESCRIPTION: Remove or rewrite documentation that describes legacy implementations which no longer apply to the current codebase, verifying each candidate against the tree. Opens one pull request of at most 15 files, highest-value first, listing skipped candidates for a re-run, and only when something is changed.

permissions:
  contents: read
  id-token: write

# Static group: two overlapping audits would open competing PRs rewriting the
# same docs, and a half-finished run's pushed branch is not something a newer
# run should cancel out from under.
concurrency:
  group: manual-agentic-pr-create-audit
  cancel-in-progress: false

jobs:
  overview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout summary helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: Publish overview
        continue-on-error: true
        uses: ./.github/actions/agentic-summary
        with:
          mode: overview
          title: Audit documentation for legacy implementations
          agent: claude
          model: ${{ inputs.model }}
          firewall: ${{ inputs.firewall }}
          description: ${{ env.RUN_DESCRIPTION }}

  audit:
    needs: overview
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;
            kv/data/secrets AGENT_GH_APP_ID | AGENT_GH_APP_ID ;
            kv/data/secrets AGENT_GH_APP_PRIVATE_KEY | AGENT_GH_APP_PRIVATE_KEY ;

      - name: Audit legacy documentation
        id: audit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_APP_ID: ${{ env.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ env.AGENT_GH_APP_PRIVATE_KEY }}
          SANDBOX_FIREWALL: ${{ inputs.firewall }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          bash infrastructure/agent-sandbox/audit-docs.sh --model "$MODEL"

      - name: Report result when the audit could not
        if: ${{ always() && steps.audit.outcome != 'success' && steps.audit.outputs.result_reported != 'true' }}
        uses: ./.github/actions/agentic-summary
        with:
          mode: result
          outcome: ${{ job.status == 'cancelled' && 'cancelled' || 'failed' }}
          note: ${{ steps.audit.outcome == 'skipped' && 'A step before the audit failed, so the agent never started.' || 'The audit stopped before it could report a result; see its step log.' }}

      - name: Email the no-changes reason
        if: ${{ !cancelled() && steps.audit.outputs.outcome == 'no-changes' }}
        continue-on-error: true
        uses: ./.github/actions/agentic-no-changes-email
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          operation: agentic-pr-create-audit
          request: ${{ env.RUN_DESCRIPTION }}
          reason: ${{ steps.audit.outputs.no_changes_reason }}
