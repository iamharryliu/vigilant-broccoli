name: cron-terraform-drift

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cron-terraform-drift
  cancel-in-progress: true

jobs:
  terraform-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Dedicated read-only identity (github-actions-tf-drift.tf) instead of
      # secrets.GCP_SERVICE_ACCOUNT: refreshing the Google resources needs
      # project-wide read that the shared SA deliberately lacks. The provider
      # only accepts this workflow on main, so the literals grant nothing
      # elsewhere (see the github_actions_tf_drift_* outputs).
      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: projects/88091895337/locations/global/workloadIdentityPools/github-actions/providers/github-tf-drift
          gcp_service_account: github-actions-tf-drift@vigilant-broccoli.iam.gserviceaccount.com
          secrets: |
            kv/data/secrets TF_CLOUD_TOKEN | TF_TOKEN_app_terraform_io ;
            kv/data/secrets CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;
            kv/data/secrets TF_GITHUB_TOKEN | GITHUB_TOKEN ;
            kv/data/secrets SUPABASE_ACCESS_TOKEN | SUPABASE_ACCESS_TOKEN ;
            kv/data/secrets OCI_CONFIG | OCI_CONFIG ;
            kv/data/secrets OCI_PRIVATE_KEY | OCI_PRIVATE_KEY ;
            kv/data/secrets GOOGLE_AUTH_PROVIDER_CLIENT_SECRET | TF_VAR_supabase_google_client_secret ;
            kv/data/secrets TF_AWS_ACCESS_KEY_ID | AWS_ACCESS_KEY_ID ;
            kv/data/secrets TF_AWS_SECRET_ACCESS_KEY | AWS_SECRET_ACCESS_KEY ;
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | TF_VAR_claude_code_oauth_token ;

      - name: Write OCI credentials
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_CONFIG" > ~/.oci/config
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/oci_api_key.pem
          sed -i "s|^key_file=.*|key_file=$HOME/.oci/oci_api_key.pem|" ~/.oci/config
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      # The repo is public, so the plan body (attribute values, IPs, rendered
      # cloud-init) never reaches the log: stdout goes to /dev/null and only
      # resource addresses and actions are summarized below. -lock=false keeps
      # a read-only plan from blocking a local `pnpm tf:apply`.
      - name: Terraform plan
        id: plan
        working-directory: infrastructure/terraform
        run: |
          set -uo pipefail
          terraform init -input=false
          terraform plan -input=false -lock=false -detailed-exitcode -out=drift.tfplan > /dev/null
          PLAN_EXIT=$?
          if [ "$PLAN_EXIT" -eq 1 ]; then
            exit 1
          fi
          echo "drift=$([ "$PLAN_EXIT" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Report drift
        if: steps.plan.outputs.drift == 'true'
        working-directory: infrastructure/terraform
        run: |
          set -euo pipefail
          {
            echo "## Terraform drift detected"
            echo
            echo "| Address | Actions | Source |"
            echo "| --- | --- | --- |"
            terraform show -json drift.tfplan | jq -r '
              [
                (.resource_drift // [] | .[] | {address, actions: .change.actions, source: "changed outside Terraform"}),
                (.resource_changes // [] | .[] | select(.mode == "managed" and .change.actions != ["no-op"]) | {address, actions: .change.actions, source: "planned"}),
                (.output_changes // {} | to_entries[] | select(.value.actions != ["no-op"]) | {address: "output.\(.key)", actions: .value.actions, source: "planned"})
              ][]
              | "| `\(.address)` | \(.actions | join(", ")) | \(.source) |"'
            echo
            echo 'Run `pnpm tf:plan` locally for the full diff, then `pnpm tf:apply` or fix the config.'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Remove plan file
        if: always()
        run: rm -f infrastructure/terraform/drift.tfplan
