name: test-security-supabase-rls

on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:
  # deploy.yml applies Supabase migrations before deploying apps.
  repository_dispatch:
    types: [deploy-fanout]

permissions:
  contents: read
  id-token: write

jobs:
  security-check:
    if: ${{ github.event_name != 'repository_dispatch' || (github.event.client_payload.conclusion == 'success' && github.event.client_payload.deployed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SUPABASE_DB_PASSWORD | SUPABASE_DB_PASSWORD ;
      - name: Run security check
        env:
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
          PGPORT: '5432'
          PGDATABASE: postgres
          SUPABASE_PUBLIC: projects/nx-workspace/libs/@vigilant-broccoli/infrastructure/src/lib/supabase-public.json
        run: |
          PGHOST=$(jq -r .dbHost "$SUPABASE_PUBLIC")
          PGUSER=$(jq -r .dbUser "$SUPABASE_PUBLIC")
          export PGHOST PGUSER
          chmod +x scripts/shell/test-supabase-rls-security.sh
          scripts/shell/test-supabase-rls-security.sh "$(jq -r .url "$SUPABASE_PUBLIC")" "$(jq -r .publishableKey "$SUPABASE_PUBLIC")"
      - name: Notify on failure
        if: failure()
        run: |
          echo "Supabase RLS security check failed! The publishable key may be able to read or write rows it should not."
          exit 1
