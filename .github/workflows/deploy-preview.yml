name: deploy-preview
run-name: deploy-preview (PR #${{ github.event.pull_request.number || inputs.pr }})

# pull_request, so the alias can be keyed on the PR number: a push event
# carries no PR number, and the first push to a branch usually predates its
# PR, which would force a second branch-named scheme. The shared WIF provider
# refuses pull_request (main.tf attribute_condition) but this workflow does
# not use it — github-actions-deploy-preview.tf pins its own provider to this
# file's job_workflow_ref, which matches refs/pull/<n>/merge just the same.
on:
  pull_request:
    paths:
      - 'projects/nx-workspace/**'
      - '.github/workflows/deploy-preview.yml'
      # Snapshot sources rendered by pages-index (agent context) and docs-md (notes)
      - 'CONTEXT.md'
      - 'TODO.md'
      - 'docs/**'
      - 'setup/dotfiles/agent-skills/**'
      - '**/CONTEXT.md'
      - 'notes/**'
  # Re-deploy a PR's previews without pushing to it — the paths filter above
  # means an unrelated commit won't do it.
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to deploy previews for'
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: deploy-preview-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

env:
  # The Cloudflare Pages "branch" for every preview deploy and the key the
  # prune matches against open PRs. Sanitised into the alias host as
  # pr-<n>.preview-<site>.pages.dev — short, so unlike a branch name it is
  # never truncated at 28 characters.
  PREVIEW_BRANCH: pr-${{ github.event.pull_request.number || inputs.pr }}

jobs:
  deploy-preview:
    # Dependabot pushes get no OIDC token, so the Vault import would fail.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-nx-workspace

      # `nx show projects` prints a JSON array, not one project per line,
      # whenever stdout is not a TTY — which is always the case on a runner.
      - name: Check which previews are needed
        id: check
        working-directory: ./projects/nx-workspace
        run: |
          CHANGED_FILES=$(git diff --name-only $NX_BASE $NX_HEAD 2>/dev/null || echo "")
          WORKFLOW_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^\.github/workflows/deploy-preview\.yml$" || true)
          # Snapshot sources live outside the nx workspace, so nx affected can't see them
          AGENT_CONTEXT_CHANGED=$(echo "$CHANGED_FILES" | grep -cE "^(CONTEXT\.md|TODO\.md|docs/|setup/dotfiles/agent-skills/)|/CONTEXT\.md$" || true)
          NOTES_CHANGED=$(echo "$CHANGED_FILES" | grep -c "^notes/" || true)

          if [[ "$WORKFLOW_CHANGED" -gt 0 ]]; then
            PROJECTS_JSON=$(pnpm exec nx show projects --withTarget=deploy:preview --json)
          else
            PROJECTS_JSON=$(pnpm exec nx show projects --affected --withTarget=deploy:preview --base=$NX_BASE --head=$NX_HEAD --json)
            if [[ "$AGENT_CONTEXT_CHANGED" -gt 0 ]]; then
              PROJECTS_JSON=$(echo "$PROJECTS_JSON" | jq -c '. + ["pages-index"]')
            fi
            if [[ "$NOTES_CHANGED" -gt 0 ]]; then
              PROJECTS_JSON=$(echo "$PROJECTS_JSON" | jq -c '. + ["docs-md"]')
            fi
          fi

          echo "projects=$(echo "$PROJECTS_JSON" | jq -r 'unique | join(",")')" >> $GITHUB_OUTPUT

      # Not the shared GCP_SERVICE_ACCOUNT / GCP_WORKLOAD_IDENTITY_PROVIDER
      # pair: this workflow runs the YAML of whatever branch was pushed, so its
      # identity is reachable by anyone who can push one. Both the GCP provider
      # (github-actions-deploy-preview.tf) and the Vault role
      # (run-vault-post-init.sh) pin job_workflow_ref to this file and grant
      # nothing but the Cloudflare Pages deploy credentials.
      - name: Import Secrets from Vault
        if: steps.check.outputs.projects != ''
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: projects/88091895337/locations/global/workloadIdentityPools/github-actions/providers/github-deploy-preview
          gcp_service_account: github-actions-deploy-preview@vigilant-broccoli.iam.gserviceaccount.com
          role: github-actions-deploy-preview-role
          secrets: |
            kv/data/deploy-preview CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/deploy-preview CLOUDFLARE_API_TOKEN_VB_DEPLOY_NX_APPS | CLOUDFLARE_API_TOKEN ;

      # --skip-nx-cache: VITE_BASE_PATH isn't a build input, so a cached main
      # build staged for GitHub Pages (base /vigilant-broccoli/) would otherwise
      # be served from the preview's root.
      # --output-style=static: nx hides successful tasks' output by default, so
      # wrangler's two URL lines never reach deploy.log and the summary comes
      # out empty.
      - name: Deploy previews
        if: steps.check.outputs.projects != ''
        working-directory: ./projects/nx-workspace
        env:
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          pnpm exec nx run-many -t deploy:preview --projects="${{ steps.check.outputs.projects }}" --skip-nx-cache --output-style=static | tee deploy.log

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          {
            echo "## Preview deployments"
            echo
            printf 'PR [#%s](%s/pull/%s) · branch `%s` · commit [`%s`](%s/commit/%s)\n' \
              "$PR_NUMBER" "$REPO_URL" "$PR_NUMBER" "$PREVIEW_HEAD_REF" "${PREVIEW_COMMIT:0:7}" "$REPO_URL" "$PREVIEW_COMMIT"
            echo
            echo "| Site | Latest (follows this PR) | This build (immutable) |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # wrangler prints the stable alias ("Deployment alias URL") and the
          # per-deployment URL ("Take a peek over at"); the subdomain tells
          # them apart, since only the alias is $PREVIEW_BRANCH. Grouped by the
          # Cloudflare project in the host, which is the only place the nx
          # project -> project-name mapping shows up in the log.
          grep -ohE 'https://[a-z0-9-]+\.preview-[a-z0-9-]+\.pages\.dev' deploy.log \
            | sort -u \
            | awk -F'[/.]' -v alias="$PREVIEW_BRANCH" '
                { seen[$4]; if ($3 == alias) a[$4] = $0; else c[$4] = $0 }
                END {
                  for (site in seen)
                    printf "| %s | %s | %s |\n", site,
                      (site in a ? a[site] : "—"), (site in c ? c[site] : "—")
                }
              ' \
            | sort >> "$GITHUB_STEP_SUMMARY"

          printf '\n_The immutable subdomain is Cloudflare'"'"'s deployment id, not the commit — each deploy gets its own, so one commit yields a different id per site. The commit is recorded on the deployment itself via `--commit-hash`, visible in the Cloudflare dashboard._\n' \
            >> "$GITHUB_STEP_SUMMARY"

      # --output-style=static for the same reason as the deploy step: the
      # script's "deleting N stale" line is the only record of what the prune
      # did, and nx would hide it. GH_TOKEN: the script asks the API which PRs
      # are still open to decide what is stale.
      - name: Prune superseded preview deployments
        if: steps.check.outputs.projects != ''
        working-directory: ./projects/nx-workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec nx run-many -t prune-deployments:preview --projects="${{ steps.check.outputs.projects }}" --output-style=static
