name: ci-pr-check

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-pr-check-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

jobs:
  nx-affected:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for nx-workspace changes
        id: check
        run: |
          NX_WORKSPACE_PATHS='^(projects/nx-workspace/|\.nvmrc$|\.github/(workflows/ci-pr-check\.yml|actions/setup-nx-workspace/))'
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" | grep -qE "$NX_WORKSPACE_PATHS"; then
            echo "nx-workspace-changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nx-workspace-changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-nx-workspace
        if: steps.check.outputs.nx-workspace-changed == 'true'

      # pull_request runs this YAML from the PR branch, so it uses its own
      # narrow WIF provider/SA/Vault role instead of the shared ones — see
      # docs/infrastructure/secret-management.md#nx-cache.
      # continue-on-error because none of this is load-bearing — worst case a
      # PR just runs without a warm cache.
      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        continue-on-error: true
        with:
          gcp_workload_identity_provider: projects/88091895337/locations/global/workloadIdentityPools/github-actions/providers/github-pr-check
          gcp_service_account: github-actions-pr-check@vigilant-broccoli.iam.gserviceaccount.com
          role: github-actions-pr-check-role
          secrets: |
            kv/data/ci-pr-check NX_CACHE_READ_TOKEN | NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN ;

      - name: Lint, test, build affected
        if: steps.check.outputs.nx-workspace-changed == 'true'
        working-directory: ./projects/nx-workspace
        env:
          # Enable the remote cache only when the token was actually fetched.
          # Nx treats a configured-but-unreachable/unauthenticated cache as a
          # fatal "Misconfigured remote cache endpoint" (the 401 fails the whole
          # run), so setting the server URL with an empty token — e.g. when the
          # Vault step above failed (continue-on-error), or before the role/token
          # is provisioned — would break every PR. Leaving the server var UNSET
          # makes Nx fall back to the local cache silently instead.
          NX_CACHE_TOKEN: ${{ env.NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN }}
        run: |
          if [ -n "$NX_CACHE_TOKEN" ]; then
            export NX_SELF_HOSTED_REMOTE_CACHE_SERVER=https://nx-cache.harryliu.dev
            export NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN="$NX_CACHE_TOKEN"
          else
            echo "nx remote cache token unavailable — building with local cache only."
          fi
          pnpm exec nx affected -t lint test build --base=$NX_BASE --head=$NX_HEAD

      # Scoped to component-library specifically (not the shared `nx affected
      # -t ... build` command above) so this doesn't also try to run
      # vb-manager-next's separate, not-yet-CI-wired e2e target. Its config
      # boots its own server via Playwright's webServer, so no live deploy or
      # extra server-management step is needed here.
      - name: Check for Sidebar e2e coverage
        id: e2e-check
        if: steps.check.outputs.nx-workspace-changed == 'true'
        working-directory: ./projects/nx-workspace
        run: |
          # Fail open: this only gates a best-effort quality check (below),
          # not the required lint/test/build step above, so a flaky/failing
          # `nx show projects` here should skip e2e for this run rather than
          # fail the whole job - jq erroring on non-JSON/empty nx output
          # otherwise takes the job down over an unrelated nx hiccup.
          AFFECTED_JSON=$(pnpm exec nx show projects --affected -p component-library --withTarget=e2e --base=$NX_BASE --head=$NX_HEAD 2>&1) || AFFECTED_JSON='[]'
          AFFECTED_E2E=$(echo "$AFFECTED_JSON" | jq -r 'join(",")' 2>/dev/null) || AFFECTED_E2E=''
          echo "projects=$AFFECTED_E2E" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.e2e-check.outputs.projects != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('projects/nx-workspace/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.e2e-check.outputs.projects != ''
        working-directory: ./projects/nx-workspace
        run: npx playwright install --with-deps chromium

      - name: Run Sidebar e2e (component-library)
        if: steps.e2e-check.outputs.projects != ''
        working-directory: ./projects/nx-workspace
        run: pnpm exec nx run-many -t e2e -p ${{ steps.e2e-check.outputs.projects }}

  pre-commit:
    if: github.event.action != 'edited'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify agent adapters
        run: |
          set -euo pipefail
          STATUS=0
          check_link() {
            if [ "$(git ls-files -s "$1" | cut -d' ' -f1)" != 120000 ]; then
              echo "::error file=$1::missing, or not a tracked symlink"
              STATUS=1
            elif [ "$(git cat-file blob ":$1")" != "$2" ]; then
              echo "::error file=$1::must point at $2"
              STATUS=1
            fi
          }
          for ctx in $(git ls-files 'CONTEXT.md' '*/CONTEXT.md'); do
            for adapter in CLAUDE.md AGENTS.md; do
              check_link "$(dirname "$ctx")/$adapter" CONTEXT.md
            done
          done
          for skill in $(git ls-files 'setup/dotfiles/agent-skills/*/SKILL.md'); do
            name=$(basename "$(dirname "$skill")")
            check_link "setup/dotfiles/.claude/commands/$name.md" "../../agent-skills/$name/SKILL.md"
          done
          exit "$STATUS"

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.10
          install_args: python

      # pre-commit/action@v3.0.1 (its latest release) pins actions/cache@v4 by
      # a mutable tag, which resolves to a Node 20 action and triggers the
      # deprecation warning — so its steps are inlined here with a pinned,
      # Node 24-compatible actions/cache instead.
      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Cache pre-commit envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ hashFiles('mise.toml') }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # nvim-tmux-config-smoketest (see .pre-commit-config.yaml) needs a real nvim binary;
      # tmux is already preinstalled on this image.
      - name: Install neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      - name: Run pre-commit
        env:
          SKIP: grind-75-tests,lint-staged
        run: pre-commit run --show-diff-on-failure --color=always --all-files

  commitlint:
    if: ${{ !contains(fromJSON('["dependabot[bot]","renovate[bot]"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          package_json_file: ./package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          cache-dependency-path: ./pnpm-lock.yaml

      # --ignore-scripts skips the root postinstall, which would install the
      # whole nx-workspace for a job that only needs commitlint.
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The PR title is what a squash merge of a multi-commit PR lands on main
      # (GitHub appends " (#N)" to it afterwards), and the commits are what a
      # single-commit squash or a rebase merge lands, so both are linted.
      # Merge commits are ignored by commitlint's defaults.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint

      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
