name: manual-promote-production

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: manual-promote-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Each dispatch resolves `main` when it fires, so a push landing between
      # the three would split production across commits.
      - name: Verify main has not moved since this run started
        run: |
          main_sha=$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::error::main moved from ${GITHUB_SHA} to ${main_sha}; rerun to promote the latest commit."
            exit 1
          fi

      - name: Dispatch production deploys from main
        run: |
          for workflow in deploy deploy-docs-md deploy-context-md; do
            gh workflow run "${workflow}.yml" --ref main -f environment=production
          done
