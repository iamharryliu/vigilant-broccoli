name: test-e2e-llm

on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        type: choice
        default: all
        options:
          - all
          - staging
          - production
  repository_dispatch:
    types: [deploy-fanout]

permissions:
  contents: read
  id-token: write

jobs:
  test-llm-service:
    if: ${{ github.event_name != 'repository_dispatch' || (github.event.client_payload.conclusion == 'success' && github.event.client_payload.deployed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'repository_dispatch' && format('["{0}"]', github.event.client_payload.environment) || inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["staging", "production"]') }}
    name: ${{ matrix.environment }} openai
    env:
      LLM_SERVICE_URL: http://127.0.0.1:3000
      MODEL: gpt-4o-mini
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SHARED_APP_TOKEN | SHARED_APP_TOKEN ;
            kv/data/secrets FLY_API_TOKEN | FLY_API_TOKEN ;

      - uses: ./.github/actions/fly-private-tunnel
        with:
          app: ${{ matrix.environment }}-llm-service

      - name: Run e2e tests (openai)
        id: llm-e2e
        env:
          LLM_SERVICE_URL: ${{ env.LLM_SERVICE_URL }}
          SHARED_APP_TOKEN: ${{ env.SHARED_APP_TOKEN }}
          MODEL: ${{ env.MODEL }}
        run: |
          chmod +x scripts/shell/test-llm-e2e.sh
          scripts/shell/test-llm-e2e.sh

      - name: Tunnel to email service
        if: failure() && steps.llm-e2e.outputs.out_of_credits == 'true'
        uses: ./.github/actions/fly-private-tunnel
        with:
          app: staging-vb-email-service
          local_port: '3001'

      - name: Email out-of-credits alert
        if: failure() && steps.llm-e2e.outputs.out_of_credits == 'true'
        env:
          SHARED_APP_TOKEN: ${{ env.SHARED_APP_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TARGET_ENVIRONMENT: ${{ matrix.environment }}
          MODEL: ${{ env.MODEL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/llm-out-of-credits-email.mjs

  test-calendar-parse:
    if: ${{ github.event_name != 'repository_dispatch' || (github.event.client_payload.conclusion == 'success' && github.event.client_payload.deployed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'repository_dispatch' && format('["{0}"]', github.event.client_payload.environment) || inputs.environment && inputs.environment != 'all' && format('["{0}"]', inputs.environment) || '["staging", "production"]') }}
    name: ${{ matrix.environment }} calendar-parse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets VB_EXPRESS_API_KEY | VB_EXPRESS_API_KEY ;

      # vb-express is public — it has no `privateOnly` flag in
      # scripts/secrets-mapping.config.ts, so it keeps a public IP and has no
      # flycast address to tunnel to, unlike the llm-service job above.
      - name: Run calendar parse e2e tests
        env:
          VB_EXPRESS_URL: https://${{ matrix.environment }}-vb-express.fly.dev
          VB_EXPRESS_API_KEY: ${{ env.VB_EXPRESS_API_KEY }}
        run: |
          chmod +x scripts/shell/test-calendar-parse-e2e.sh
          scripts/shell/test-calendar-parse-e2e.sh
