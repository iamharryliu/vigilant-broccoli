name: manual-agentic-pr-update

run-name: manual-agentic-pr-update (${{ inputs.operation }}) PR ${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number or URL to update (e.g. "149").'
        type: string
        required: true
      operation:
        description: 'Operation to perform on the PR branch.'
        type: choice
        default: change
        options:
          - change
          - fix-ci
          - resolve-conflicts
      instruction:
        description: 'Required for change; optional guidance for fix-ci; leave blank for resolve-conflicts.'
        type: string
        default: ''
      model:
        description: 'Claude model to run the agent with.'
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus
          - haiku
      firewall:
        description: 'In-container egress firewall (turn off if iptables/ipset fails on the runner).'
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'

permissions:
  contents: read
  id-token: write

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.validate.outputs.pr }}
    steps:
      - name: Normalize PR
        id: validate
        env:
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          PR_PREFIX="https://github.com/${GITHUB_REPOSITORY}/pull/"
          if [[ "$PR" == "$PR_PREFIX"* ]]; then
            PR=${PR#"$PR_PREFIX"}
          fi
          if [[ ! "$PR" =~ ^[0-9]{1,20}$ ]]; then
            echo "ERROR: 'pr' must be a PR number or a pull request URL for ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          PR=$(printf '%s' "$PR" | sed 's/^0*//')
          if [ -z "$PR" ]; then
            echo "ERROR: 'pr' must be greater than zero." >&2
            exit 1
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Checkout summary helper
        if: ${{ !cancelled() && steps.validate.outputs.pr != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github

      - name: Publish overview
        if: ${{ !cancelled() && steps.validate.outputs.pr != '' }}
        continue-on-error: true
        uses: ./.github/actions/agentic-summary
        with:
          mode: overview
          title: Update a pull request
          agent: claude
          model: ${{ inputs.model }}
          firewall: ${{ inputs.firewall }}
          operation: ${{ (inputs.operation == 'change' && 'Apply a change') || (inputs.operation == 'fix-ci' && 'Fix CI') || 'Resolve conflicts' }}
          pull_request: https://github.com/${{ github.repository }}/pull/${{ steps.validate.outputs.pr }}
          description: ${{ (inputs.operation == 'change' && 'Apply the requested change to the pull request branch and verify its cumulative result.') || (inputs.operation == 'fix-ci' && 'Diagnose the pull request''s failing CI checks from their logs and fix the branch so the checks pass.') || 'Merge origin/main into the pull request branch and resolve conflicts, preserving both sides.' }}
          task_label: ${{ inputs.operation == 'change' && 'Instruction' || 'Additional guidance' }}
          task: ${{ inputs.instruction }}

      - name: Validate operation inputs
        env:
          OPERATION: ${{ inputs.operation }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            change)
              if [[ ! "$INSTRUCTION" =~ [^[:space:]] ]]; then
                echo "ERROR: 'instruction' is required for change." >&2
                exit 1
              fi
              ;;
            fix-ci) ;;
            resolve-conflicts)
              if [ -n "$INSTRUCTION" ]; then
                echo "ERROR: 'instruction' must be blank for resolve-conflicts." >&2
                exit 1
              fi
              ;;
            *)
              echo "ERROR: Unknown operation." >&2
              exit 1
              ;;
          esac

  update-pr:
    needs: key
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: manual-agentic-pr-update-${{ needs.key.outputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;
            kv/data/secrets AGENT_GH_APP_ID | AGENT_GH_APP_ID ;
            kv/data/secrets AGENT_GH_APP_PRIVATE_KEY | AGENT_GH_APP_PRIVATE_KEY ;

      - name: Update PR
        id: update
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_APP_ID: ${{ env.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ env.AGENT_GH_APP_PRIVATE_KEY }}
          SANDBOX_FIREWALL: ${{ inputs.firewall }}
          MODEL: ${{ inputs.model }}
          PR: ${{ needs.key.outputs.pr }}
          OPERATION: ${{ inputs.operation }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            change)
              bash infrastructure/agent-sandbox/update-pr.sh --model "$MODEL" "$PR" "$INSTRUCTION"
              ;;
            fix-ci)
              if [ -n "$INSTRUCTION" ]; then
                bash infrastructure/agent-sandbox/fix-pr-ci.sh --model "$MODEL" "$PR" "$INSTRUCTION"
              else
                bash infrastructure/agent-sandbox/fix-pr-ci.sh --model "$MODEL" "$PR"
              fi
              ;;
            resolve-conflicts)
              bash infrastructure/agent-sandbox/resolve-pr-conflicts.sh --model "$MODEL" "$PR"
              ;;
          esac

      - name: Report result
        if: always()
        uses: ./.github/actions/agentic-summary
        with:
          mode: result
          outcome: ${{ (steps.update.outcome == 'success' && 'pr-updated') || (job.status == 'cancelled' && 'cancelled') || 'failed' }}
          result_pr_url: https://github.com/${{ github.repository }}/pull/${{ needs.key.outputs.pr }}
          note: ${{ steps.update.outcome == 'skipped' && 'A step before the update failed, so the agent never started.' || '' }}
