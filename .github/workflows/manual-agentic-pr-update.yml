name: manual-agentic-pr-update

run-name: manual-agentic-pr-update (${{ inputs.operation }}) PR ${{ inputs.pr }}

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number or URL to update (e.g. "149").'
        type: string
        required: true
      operation:
        description: 'Operation to perform on the PR branch.'
        type: choice
        default: change
        options:
          - change
          - fix-ci
          - resolve-conflicts
      instruction:
        description: 'Required for change; optional guidance for fix-ci; leave blank for resolve-conflicts.'
        type: string
        default: ''
      model:
        description: 'Claude model to run the agent with.'
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus
          - haiku
      firewall:
        description: 'In-container egress firewall (turn off if iptables/ipset fails on the runner).'
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'

permissions:
  contents: read
  id-token: write

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pr: ${{ steps.validate.outputs.pr }}
    steps:
      - name: Validate dispatch inputs and link PR
        id: validate
        env:
          PR: ${{ inputs.pr }}
          OPERATION: ${{ inputs.operation }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          PR_PREFIX="https://github.com/${GITHUB_REPOSITORY}/pull/"
          if [[ "$PR" == "$PR_PREFIX"* ]]; then
            PR=${PR#"$PR_PREFIX"}
          fi
          if [[ ! "$PR" =~ ^[0-9]{1,20}$ ]]; then
            echo "ERROR: 'pr' must be a PR number or a pull request URL for ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          PR=$(printf '%s' "$PR" | sed 's/^0*//')
          if [ -z "$PR" ]; then
            echo "ERROR: 'pr' must be greater than zero." >&2
            exit 1
          fi
          echo "**Pull request:** ${PR_PREFIX}${PR}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Operation:** ${OPERATION}" >> "$GITHUB_STEP_SUMMARY"
          case "$OPERATION" in
            change)
              if [[ ! "$INSTRUCTION" =~ [^[:space:]] ]]; then
                echo "ERROR: 'instruction' is required for change." >&2
                exit 1
              fi
              ;;
            fix-ci) ;;
            resolve-conflicts)
              if [ -n "$INSTRUCTION" ]; then
                echo "ERROR: 'instruction' must be blank for resolve-conflicts." >&2
                exit 1
              fi
              ;;
            *)
              echo "ERROR: Unknown operation." >&2
              exit 1
              ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

  update-pr:
    needs: key
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: manual-agentic-pr-update-${{ needs.key.outputs.pr }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;
            kv/data/secrets AGENT_GH_APP_ID | AGENT_GH_APP_ID ;
            kv/data/secrets AGENT_GH_APP_PRIVATE_KEY | AGENT_GH_APP_PRIVATE_KEY ;

      - name: Update PR
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_APP_ID: ${{ env.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ env.AGENT_GH_APP_PRIVATE_KEY }}
          SANDBOX_FIREWALL: ${{ inputs.firewall }}
          MODEL: ${{ inputs.model }}
          PR: ${{ needs.key.outputs.pr }}
          OPERATION: ${{ inputs.operation }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            change)
              bash infrastructure/agent-sandbox/update-pr.sh --model "$MODEL" "$PR" "$INSTRUCTION"
              ;;
            fix-ci)
              if [ -n "$INSTRUCTION" ]; then
                bash infrastructure/agent-sandbox/fix-pr-ci.sh --model "$MODEL" "$PR" "$INSTRUCTION"
              else
                bash infrastructure/agent-sandbox/fix-pr-ci.sh --model "$MODEL" "$PR"
              fi
              ;;
            resolve-conflicts)
              bash infrastructure/agent-sandbox/resolve-pr-conflicts.sh --model "$MODEL" "$PR"
              ;;
          esac
