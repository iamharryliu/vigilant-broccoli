name: manual-agentic-update-pr

# Runs the same agent PR update as the local `pnpm agentic:pr:update`, but on the
# ephemeral GitHub-hosted runner: it builds and runs the vb-agent-sandbox
# container (checks out the PR branch, headless Claude Code applies the change,
# commit, push, PR comment). Secrets come from Vault; the branch push + comment
# use a minted GitHub App token, so the workflow's own GITHUB_TOKEN needs no write scope.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number or URL to update (e.g. "149").'
        type: string
        required: true
      instruction:
        description: 'Free-text change to apply to the PR branch.'
        type: string
        required: true
      model:
        description: 'Claude model to run the agent with.'
        type: choice
        default: sonnet
        options:
          - sonnet
          - opus
          - haiku
      firewall:
        description: 'In-container egress firewall (turn off if iptables/ipset fails on the runner).'
        type: choice
        default: 'on'
        options:
          - 'on'
          - 'off'

permissions:
  contents: read
  id-token: write

jobs:
  update-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLAUDE_CODE_OAUTH_TOKEN | CLAUDE_CODE_OAUTH_TOKEN ;
            kv/data/secrets AGENT_GH_APP_ID | AGENT_GH_APP_ID ;
            kv/data/secrets AGENT_GH_APP_PRIVATE_KEY | AGENT_GH_APP_PRIVATE_KEY ;

      - name: Update PR
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ env.CLAUDE_CODE_OAUTH_TOKEN }}
          AGENT_GH_APP_ID: ${{ env.AGENT_GH_APP_ID }}
          AGENT_GH_APP_PRIVATE_KEY: ${{ env.AGENT_GH_APP_PRIVATE_KEY }}
          SANDBOX_FIREWALL: ${{ inputs.firewall }}
          MODEL: ${{ inputs.model }}
          PR: ${{ inputs.pr }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PR" | grep -qE '^([0-9]+|https://github\.com/[^ ]+)$'; then
            echo "ERROR: 'pr' must be a PR number or a github.com URL." >&2
            exit 1
          fi
          bash infrastructure/agent-sandbox/update-pr.sh --model "$MODEL" "$PR" "$INSTRUCTION"
