name: notify-complete

on:
  repository_dispatch:
    types: [deploy-fanout]

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SHARED_APP_TOKEN | SHARED_APP_TOKEN ;
            kv/data/secrets SOCKET_SERVER_URL | SOCKET_SERVER_URL ;
            kv/data/secrets FLY_API_TOKEN | FLY_API_TOKEN ;

      - name: Notify deploy complete
        uses: ./.github/actions/deploy-notify
        with:
          status: ${{ github.event.client_payload.conclusion == 'success' && 'success' || 'failure' }}
          job: deploy
          socket_server_url: ${{ env.SOCKET_SERVER_URL }}
          shared_app_token: ${{ env.SHARED_APP_TOKEN }}
          started_at: ${{ github.event.client_payload.started_at }}
          run_url: ${{ github.event.client_payload.run_url }}

      - name: Look up deployed PR
        id: pr
        if: github.event.client_payload.commit_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          PR_JSON=$(gh api "repos/${{ github.repository }}/commits/${COMMIT_SHA}/pulls" --jq '.[0] // empty')
          if [[ -n "$PR_JSON" ]]; then
            {
              echo "number=$(jq -r .number <<<"$PR_JSON")"
              echo "title=$(jq -r .title <<<"$PR_JSON")"
              echo "url=$(jq -r .html_url <<<"$PR_JSON")"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Tunnel to email service
        uses: ./.github/actions/fly-private-tunnel
        with:
          app: staging-vb-email-service

      - name: Notify deploy complete by email
        env:
          SHARED_APP_TOKEN: ${{ env.SHARED_APP_TOKEN }}
          DEPLOY_CONCLUSION: ${{ github.event.client_payload.conclusion }}
          DEPLOY_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          RUN_URL: ${{ github.event.client_payload.run_url }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
          COMMIT_MESSAGE: ${{ github.event.client_payload.commit_message }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: node .github/scripts/deploy-complete-email.mjs
