name: notify-complete

on:
  repository_dispatch:
    types: [deploy-fanout]

permissions:
  contents: read
  id-token: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SHARED_APP_TOKEN | SHARED_APP_TOKEN ;
            kv/data/secrets SOCKET_SERVER_URL | SOCKET_SERVER_URL ;

      - name: Notify deploy complete
        uses: ./.github/actions/deploy-notify
        with:
          status: ${{ github.event.client_payload.conclusion == 'success' && 'success' || 'failure' }}
          job: deploy
          socket_server_url: ${{ env.SOCKET_SERVER_URL }}
          shared_app_token: ${{ env.SHARED_APP_TOKEN }}
          started_at: ${{ github.event.client_payload.started_at }}
          run_url: ${{ github.event.client_payload.run_url }}
