name: test-security-cloudflare-access

on:
  schedule:
    - cron: '45 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infrastructure/terraform/**'

permissions:
  contents: read
  id-token: write

jobs:
  security-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gitea
            hostname: git.harryliu.dev
            origin_ip_secret: GITEA_VM_IP
          - name: code-server
            hostname: code.harryliu.dev
            origin_ip_secret: CODE_SERVER_VM_IP
          - name: grafana
            hostname: grafana.harryliu.dev
            origin_ip_secret: ''
          - name: immich
            hostname: images.harryliu.dev
            origin_ip_secret: ''
          - name: rabbitmq
            hostname: queue.harryliu.dev
            origin_ip_secret: ''
          - name: seafile
            hostname: drive.harryliu.dev
            origin_ip_secret: ''
          # Mirrors the protected provider and custom hosts in cloudflare-staging-ui.tf.
          - name: staging-pages
            hostname: staging-bookmarks-react.pages.dev,staging-calendars.pages.dev,staging-cloud-8-skate-react.pages.dev,staging-component-library.pages.dev,staging-context-md.pages.dev,staging-docs-md.pages.dev,staging-findme.pages.dev,staging-harryliu-dev-react.pages.dev,staging-pomodoro-react.pages.dev,staging-utilities-ui.pages.dev,staging-waiting-games.pages.dev,staging-whiteboard.pages.dev,staging-bookmarks.harryliu.dev,staging-calendar.harryliu.dev,staging-components.harryliu.dev,staging-context.harryliu.dev,staging-docs.harryliu.dev,staging-findme.harryliu.dev,staging.harryliu.dev,staging-pomodoro.harryliu.dev,staging-utilities.harryliu.dev,staging-waiting.harryliu.dev,staging-whiteboard.harryliu.dev
            origin_ip_secret: ''
          - name: vault
            hostname: vault.harryliu.dev
            origin_ip_secret: ''
          # Same VM and tunnel as code-server, whose entry covers the origin check.
          - name: web-terminal
            hostname: shell.harryliu.dev
            origin_ip_secret: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import origin IP from Vault
        if: matrix.origin_ip_secret != ''
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets ${{ matrix.origin_ip_secret }} | ORIGIN_IP ;

      - name: Run Cloudflare Access security check for ${{ matrix.name }}
        env:
          ORIGIN_IP: ${{ env.ORIGIN_IP }}
        run: |
          chmod +x scripts/shell/check-cloudflare-access-security.sh
          scripts/shell/check-cloudflare-access-security.sh "${{ matrix.name }}" "${{ matrix.hostname }}" "${ORIGIN_IP:-}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Cloudflare Access security check failed for ${{ matrix.name }} (${{ matrix.hostname }})!"
          exit 1
