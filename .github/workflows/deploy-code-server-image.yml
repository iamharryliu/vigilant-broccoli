name: deploy-code-server-image

# Builds the derived code-server image (this repo's toolchain baked in) and
# pushes it to Docker Hub. cloud-init-code-server.yaml pulls the result, so a
# container recreate no longer re-downloads ~1GB of apt/npm on every start.
#
# Runs on an arm64 runner because the code-server VM is an OCI Ampere A1
# (VM.Standard.A1.Flex) -- building natively avoids QEMU emulation, which turns
# the google-cloud-cli install into a multi-hour job.

on:
  push:
    branches: [main]
    paths:
      - infrastructure/code-server/Dockerfile
      - setup/linux/apt-packages.txt
      - .github/workflows/deploy-code-server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE: iamharryliu/vb-code-server

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets DOCKERHUB_TOKEN | DOCKERHUB_TOKEN ;

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: iamharryliu
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Build context is the repo root so the Dockerfile can COPY
      # setup/linux/apt-packages.txt.
      - name: Build image
        run: |
          docker build \
            --platform linux/arm64 \
            -f infrastructure/code-server/Dockerfile \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${GITHUB_SHA}" \
            .

      # Both tags are pushed: cloud-init tracks :latest by default, and the
      # immutable sha- tag is there to pin var.code_server_image to a known
      # build when rolling back.
      - name: Push image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA}"

      - name: Summary
        run: |
          {
            echo "### code-server image pushed"
            echo
            echo "- \`$IMAGE:latest\`"
            echo "- \`$IMAGE:sha-${GITHUB_SHA}\`"
            echo
            echo "Run \`manual-replace-code-server\` to roll the VM onto it."
          } >> "$GITHUB_STEP_SUMMARY"
