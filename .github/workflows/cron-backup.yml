name: cron-backup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cron-backup.yml
      - .github/scripts/backup-storage.sh
  schedule:
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: cron-backup
  cancel-in-progress: false

jobs:
  backup-vb-repo:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Separate and non-fatal so a missing R2 key or Vault hiccup still lets
      # the GCS copy run; backup-storage.sh then fails the job on the R2 side.
      - name: Import R2 backup credentials from Vault
        continue-on-error: true
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/secrets BACKUP_R2_ACCESS_KEY_ID | BACKUP_R2_ACCESS_KEY_ID ;
            kv/data/secrets BACKUP_R2_SECRET_ACCESS_KEY | BACKUP_R2_SECRET_ACCESS_KEY ;

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Upload backup to GCS and R2
        run: |
          set -euo pipefail
          curl -sfL -o vigilant-broccoli.zip https://github.com/iamharryliu/vigilant-broccoli/archive/refs/heads/main.zip
          .github/scripts/backup-storage.sh upload vigilant-broccoli.zip repo-backup- .zip

  backup-gitea:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets OCI_VM_SSH_KEY | OCI_VM_SSH_KEY ;
            kv/data/secrets GITEA_VM_IP | GITEA_VM_IP ;

      # Non-fatal like backup-vb-repo's, so the GCS copy still runs without R2.
      - name: Import R2 backup credentials from Vault
        continue-on-error: true
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/secrets BACKUP_R2_ACCESS_KEY_ID | BACKUP_R2_ACCESS_KEY_ID ;
            kv/data/secrets BACKUP_R2_SECRET_ACCESS_KEY | BACKUP_R2_SECRET_ACCESS_KEY ;

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Dump Gitea and upload to GCS and R2
        env:
          OCI_VM_SSH_KEY: ${{ env.OCI_VM_SSH_KEY }}
          GITEA_VM_IP: ${{ env.GITEA_VM_IP }}
        run: |
          set -euo pipefail
          # Ensure a trailing newline — the stored key lacks one and OpenSSL/libcrypto rejects it.
          { printf '%s' "$OCI_VM_SSH_KEY" | base64 -d; echo; } > ssh_key
          chmod 600 ssh_key
          SSH="ssh -i ssh_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 ubuntu@${GITEA_VM_IP}"
          # gitea dump writes the archive inside the container; copy it out to the host, then pull it.
          $SSH 'sudo docker exec -u git -w /tmp gitea gitea dump -t /tmp -c /data/gitea/conf/app.ini --file gitea-dump.zip \
            && sudo docker cp gitea:/tmp/gitea-dump.zip /tmp/gitea-dump.zip \
            && sudo chown "$(id -u):$(id -g)" /tmp/gitea-dump.zip \
            && sudo docker exec -u git gitea rm -f /tmp/gitea-dump.zip'
          scp -i ssh_key -o StrictHostKeyChecking=accept-new "ubuntu@${GITEA_VM_IP}:/tmp/gitea-dump.zip" gitea-dump.zip
          $SSH 'sudo rm -f /tmp/gitea-dump.zip'
          rm -f ssh_key
          .github/scripts/backup-storage.sh upload gitea-dump.zip gitea-backup- .zip
          rm -f gitea-dump.zip

  backup-mongodb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets MONGODB_URI | MONGODB_URI ;

      # Non-fatal like backup-vb-repo's, so the GCS copy still runs without R2.
      - name: Import R2 backup credentials from Vault
        continue-on-error: true
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/secrets BACKUP_R2_ACCESS_KEY_ID | BACKUP_R2_ACCESS_KEY_ID ;
            kv/data/secrets BACKUP_R2_SECRET_ACCESS_KEY | BACKUP_R2_SECRET_ACCESS_KEY ;

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Cache mongodb-database-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mongodb-tools.deb
          key: mongodb-database-tools-100.10.0-ubuntu2204-x86_64

      - name: Install mongodb-database-tools
        run: |
          set -euo pipefail
          [ -f mongodb-tools.deb ] || curl -sL -o mongodb-tools.deb https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.10.0.deb
          sudo dpkg -i mongodb-tools.deb

      - name: Dump and upload backup to GCS and R2
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          MONGODB_DB: vb-manager
        run: |
          set -euo pipefail
          mongodump --uri="$MONGODB_URI" --db="$MONGODB_DB" --archive="mongodb-$MONGODB_DB.gz" --gzip
          .github/scripts/backup-storage.sh upload "mongodb-$MONGODB_DB.gz" mongodb-backup- .gz

  backup-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Import Secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets SUPABASE_DB_PASSWORD | SUPABASE_DB_PASSWORD ;

      # Non-fatal like backup-vb-repo's, so the GCS copy still runs without R2.
      - name: Import R2 backup credentials from Vault
        continue-on-error: true
        uses: ./.github/actions/vault-secrets
        with:
          gcp_workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          secrets: |
            kv/data/secrets CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/secrets BACKUP_R2_ACCESS_KEY_ID | BACKUP_R2_ACCESS_KEY_ID ;
            kv/data/secrets BACKUP_R2_SECRET_ACCESS_KEY | BACKUP_R2_SECRET_ACCESS_KEY ;

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Cache PostgreSQL apt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives/*.deb
          key: apt-postgresql-client-17

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -sL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/postgresql.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump and upload backup to GCS and R2
        env:
          PGPASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-eu-west-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.jrdosjjgmsoodpjmjqxx
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          # The runner image ships an older postgresql-client on PATH; call the v17 binary directly.
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges | gzip > "supabase.sql.gz"
          .github/scripts/backup-storage.sh upload supabase.sql.gz supabase-backup- .sql.gz
