#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2

write_files:
  - path: /opt/code-server/Caddyfile
    content: |
      ${code_server_domain} {
        tls /etc/caddy/certs/origin.pem /etc/caddy/certs/origin.key
        reverse_proxy code-server:8443
      }

      ${web_terminal_domain} {
        tls /etc/caddy/certs/origin.pem /etc/caddy/certs/origin.key
        reverse_proxy code-server:7681
      }

  - path: /opt/code-server/certs/origin.pem
    permissions: '0644'
    content: |
      ${indent(6, code_server_origin_cert)}

  - path: /opt/code-server/certs/origin.key
    permissions: '0600'
    content: |
      ${indent(6, code_server_origin_key)}

  - path: /opt/code-server/custom-init/10-sync-repo.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      # The toolchain (apt packages, Node, google-cloud-cli, claude-code) is
      # baked into the image -- see infrastructure/code-server/Dockerfile.
      # Installing it here instead meant re-downloading ~1GB into the image
      # filesystem on every container recreate. What is left runs per start
      # because it targets the persistent /config volume, and is cheap.
      if [ ! -d /config/vigilant-broccoli ]; then
        git clone https://github.com/iamharryliu/vigilant-broccoli.git /config/vigilant-broccoli
        chown -R abc:abc /config/vigilant-broccoli
      else
        HOME=/config s6-setuidgid abc git -C /config/vigilant-broccoli pull --ff-only || true
      fi

      if [ -f /config/vigilant-broccoli/setup/linux/install.sh ]; then
        HOME=/config s6-setuidgid abc bash /config/vigilant-broccoli/setup/linux/install.sh -y
      fi

      # Same shape as the agent sandbox entrypoint: git pushes through gh, which
      # the image's gh wrapper feeds the App installation token that the
      # manual-refresh-code-server-github-token workflow drops in /run/secrets.
      HOME=/config s6-setuidgid abc git -C /config/vigilant-broccoli config credential.helper '!gh auth git-credential'

      CLAUDE_STATE=/config/.claude.json
      if [ -f "$CLAUDE_STATE" ]; then
        jq '.hasCompletedOnboarding = true | .bypassPermissionsModeAccepted = true' "$CLAUDE_STATE" > "$CLAUDE_STATE.tmp" && mv "$CLAUDE_STATE.tmp" "$CLAUDE_STATE"
      else
        echo '{"hasCompletedOnboarding": true, "bypassPermissionsModeAccepted": true}' > "$CLAUDE_STATE"
      fi
      chown abc:abc "$CLAUDE_STATE"

  # Tracks the image tag in docker-compose.yml so a deploy-code-server-image
  # push reaches the VM without replacing it. A pinned sha- tag pulls nothing
  # new, so pinning still holds. `up -d` recreates the container only when the
  # pulled image differs, which ends any live tmux session in it. Every new
  # :latest leaves the previous image behind and the 50 GB boot volume cannot
  # grow (OCI free storage is fully allocated), so a full disk fails the pull
  # silently every 15 minutes. Images are pruned after each update and before a
  # pull when space is short; never prune volumes, /config and caddy state live
  # in them.
  - path: /opt/code-server/update-image.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e
      MIN_FREE_GB=8
      COMPOSE="docker compose -f /opt/code-server/docker-compose.yml"

      free_gb() { df --output=avail -B1G /var/lib/docker | tail -n1 | tr -d ' '; }

      if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
        docker image prune -a -f
        if [ "$(free_gb)" -lt "$MIN_FREE_GB" ]; then
          echo "update-image: only $(free_gb)G free on /var/lib/docker after pruning images, need $${MIN_FREE_GB}G; skipping pull" >&2
          exit 1
        fi
      fi

      $COMPOSE pull code-server
      $COMPOSE up -d code-server
      docker image prune -a -f

  - path: /etc/systemd/system/code-server-update.service
    content: |
      [Unit]
      Description=Pull the code-server image and recreate the container if it changed
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/opt/code-server/update-image.sh

  # Anonymous Docker Hub pulls allow 100 per 6h per IP; every 15 minutes is 24.
  - path: /etc/systemd/system/code-server-update.timer
    content: |
      [Unit]
      Description=Check Docker Hub for a new code-server image

      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=15min

      [Install]
      WantedBy=timers.target

  - path: /opt/code-server/docker-compose.yml
    content: |
      services:
        code-server:
          image: ${code_server_image}
          container_name: code-server
          restart: unless-stopped
          environment:
            PUID: "1000"
            PGID: "1000"
            TZ: America/Toronto
            PASSWORD: ${code_server_password}
            SUDO_PASSWORD: ${code_server_password}
            DEFAULT_WORKSPACE: /config/vigilant-broccoli
            CLAUDE_CODE_OAUTH_TOKEN: "${claude_code_oauth_token}"
            GH_TOKEN_FILE: /run/secrets/gh-token.json
            # Not a secret: the team domain and AUD are in every Access JWT.
            # The web-terminal service verifies them; port 7681 is only
            # reachable from Caddy over the compose network, never published.
            CF_ACCESS_TEAM_DOMAIN: ${access_team_domain}
            CF_ACCESS_AUD: ${web_terminal_aud}
            TERMINAL_PORT: "7681"
          volumes:
            - code_server_config:/config
            - /opt/code-server/custom-init:/custom-cont-init.d:ro
            - /opt/code-server/secrets:/run/secrets:ro
        caddy:
          image: caddy:2-alpine
          container_name: caddy
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - /opt/code-server/Caddyfile:/etc/caddy/Caddyfile:ro
            - /opt/code-server/certs:/etc/caddy/certs:ro
            - caddy_data:/data
            - caddy_config:/config
          depends_on:
            - code-server
      volumes:
        code_server_config:
        caddy_data:
        caddy_config:

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  # Owned by uid 1000 (the container's abc user, PUID above) so gh-token can
  # read what manual-refresh-code-server-github-token.yml drops here.
  - install -d -m 0700 -o 1000 -g 1000 /opt/code-server/secrets
  - docker compose -f /opt/code-server/docker-compose.yml up -d
  - systemctl daemon-reload
  - systemctl enable --now code-server-update.timer
