#cloud-config
package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2

write_files:
  - path: /opt/code-server/Caddyfile
    content: |
      ${code_server_domain} {
        tls /etc/caddy/certs/origin.pem /etc/caddy/certs/origin.key
        reverse_proxy code-server:8443
      }

  - path: /opt/code-server/certs/origin.pem
    permissions: '0644'
    content: |
      ${indent(6, code_server_origin_cert)}

  - path: /opt/code-server/certs/origin.key
    permissions: '0600'
    content: |
      ${indent(6, code_server_origin_key)}

  - path: /opt/code-server/custom-init/10-sync-repo.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      # The toolchain (apt packages, Node, google-cloud-cli, claude-code) is
      # baked into the image -- see infrastructure/code-server/Dockerfile.
      # Installing it here instead meant re-downloading ~1GB into the image
      # filesystem on every container recreate. What is left runs per start
      # because it targets the persistent /config volume, and is cheap.
      if [ ! -d /config/vigilant-broccoli ]; then
        git clone https://github.com/iamharryliu/vigilant-broccoli.git /config/vigilant-broccoli
        chown -R abc:abc /config/vigilant-broccoli
      else
        HOME=/config s6-setuidgid abc git -C /config/vigilant-broccoli pull --ff-only || true
      fi

      if [ -f /config/vigilant-broccoli/setup/linux/install.sh ]; then
        HOME=/config s6-setuidgid abc bash /config/vigilant-broccoli/setup/linux/install.sh -y
      fi

  - path: /opt/code-server/docker-compose.yml
    content: |
      services:
        code-server:
          image: ${code_server_image}
          container_name: code-server
          restart: unless-stopped
          environment:
            PUID: "1000"
            PGID: "1000"
            TZ: America/Toronto
            PASSWORD: ${code_server_password}
            SUDO_PASSWORD: ${code_server_password}
            DEFAULT_WORKSPACE: /config/vigilant-broccoli
          volumes:
            - code_server_config:/config
            - /opt/code-server/custom-init:/custom-cont-init.d:ro
        caddy:
          image: caddy:2-alpine
          container_name: caddy
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - /opt/code-server/Caddyfile:/etc/caddy/Caddyfile:ro
            - /opt/code-server/certs:/etc/caddy/certs:ro
            - caddy_data:/data
            - caddy_config:/config
          depends_on:
            - code-server
      volumes:
        code_server_config:
        caddy_data:
        caddy_config:

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  - docker compose -f /opt/code-server/docker-compose.yml up -d
