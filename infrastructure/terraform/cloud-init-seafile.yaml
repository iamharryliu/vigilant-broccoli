#cloud-config
package_update: true
package_upgrade: true

ssh_authorized_keys:
  - ${seafile_ssh_keys[0]}
  - ${seafile_ssh_keys[1]}

packages:
  - docker.io
  - docker-compose-v2

write_files:
  - path: /opt/seafile/Caddyfile
    content: |
      ${seafile_domain} {
        tls /etc/caddy/certs/origin.pem /etc/caddy/certs/origin.key
        reverse_proxy seafile:80
      }

  - path: /opt/seafile/certs/origin.pem
    permissions: '0644'
    content: |
      ${indent(6, seafile_origin_cert)}

  - path: /opt/seafile/certs/origin.key
    permissions: '0600'
    content: |
      ${indent(6, seafile_origin_key)}

  - path: /opt/seafile/docker-compose.yml
    permissions: '0600'
    content: |
      services:
        db:
          image: mariadb:10.11
          container_name: seafile-db
          restart: unless-stopped
          environment:
            MYSQL_ROOT_PASSWORD: ${seafile_db_root_password}
            MYSQL_LOG_CONSOLE: "true"
          volumes:
            - /mnt/seafile-data/db:/var/lib/mysql
        memcached:
          image: memcached:1.6.29
          container_name: seafile-memcached
          restart: unless-stopped
          entrypoint: memcached -m 256
        seafile:
          image: seafileltd/seafile-mc:11.0.13
          container_name: seafile
          restart: unless-stopped
          environment:
            DB_HOST: db
            DB_ROOT_PASSWD: ${seafile_db_root_password}
            TIME_ZONE: America/Toronto
            SEAFILE_ADMIN_EMAIL: ${seafile_admin_email}
            SEAFILE_ADMIN_PASSWORD: ${seafile_admin_password}
            SEAFILE_SERVER_LETSENCRYPT: "false"
            SEAFILE_SERVER_HOSTNAME: ${seafile_domain}
          volumes:
            - /mnt/seafile-data/shared:/shared
          depends_on:
            - db
            - memcached
        caddy:
          image: caddy:2-alpine
          container_name: caddy
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - /opt/seafile/Caddyfile:/etc/caddy/Caddyfile:ro
            - /opt/seafile/certs:/etc/caddy/certs:ro
            - caddy_data:/data
            - caddy_config:/config
          depends_on:
            - seafile
      volumes:
        caddy_data:
        caddy_config:

  - path: /opt/seafile/fix-csrf.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      for i in $(seq 1 60); do
        if docker exec seafile test -f /shared/seafile/conf/seahub_settings.py; then
          break
        fi
        sleep 5
      done
      docker exec seafile sed -i 's#http://${seafile_domain}#https://${seafile_domain}#g' /shared/seafile/conf/seahub_settings.py
      docker exec seafile bash -c "grep -q CSRF_TRUSTED_ORIGINS /shared/seafile/conf/seahub_settings.py || echo 'CSRF_TRUSTED_ORIGINS = [\"https://${seafile_domain}\"]' >> /shared/seafile/conf/seahub_settings.py"
      docker compose -f /opt/seafile/docker-compose.yml restart seafile

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  # Mount the attached block volume at /mnt/seafile-data BEFORE Docker starts,
  # so the db/seafile bind-mounts above land on the persistent volume, not the
  # boot disk. Detect the data disk as the whole disk that is NOT the boot disk
  # (device names aren't stable across AWS's Xen/NVMe naming), format only if
  # blank, and mount by UUID — a re-provision reattaches existing data intact
  # instead of wiping it.
  - mkdir -p /mnt/seafile-data
  - 'ROOT_DISK=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" | head -1); for d in $(lsblk -dno NAME --nodeps -e7); do [ "$d" = "$ROOT_DISK" ] && continue; DATA_DEV="/dev/$d"; break; done; blkid "$DATA_DEV" || mkfs.ext4 -F "$DATA_DEV"; DATA_UUID=$(blkid -s UUID -o value "$DATA_DEV"); grep -q "$DATA_UUID" /etc/fstab || echo "UUID=$DATA_UUID /mnt/seafile-data ext4 defaults,_netdev,nofail 0 2" >> /etc/fstab'
  - mount /mnt/seafile-data
  - docker compose -f /opt/seafile/docker-compose.yml up -d
  - /opt/seafile/fix-csrf.sh
