#cloud-config
package_update: true
package_upgrade: true

ssh_authorized_keys:
  - ${immich_ssh_keys[0]}
  - ${immich_ssh_keys[1]}

packages:
  - docker.io
  - docker-compose-v2

write_files:
  - path: /opt/immich/docker-compose.yml
    permissions: '0600'
    content: |
      services:
        immich-server:
          image: ghcr.io/immich-app/immich-server:release
          container_name: immich-server
          restart: unless-stopped
          environment:
            DB_HOSTNAME: database
            DB_USERNAME: immich
            DB_PASSWORD: ${immich_db_password}
            DB_DATABASE_NAME: immich
            REDIS_HOSTNAME: redis
          volumes:
            - /mnt/immich-data/upload:/usr/src/app/upload
            - /etc/localtime:/etc/localtime:ro
          ports:
            - "127.0.0.1:2283:2283"
          depends_on:
            - redis
            - database
        immich-machine-learning:
          image: ghcr.io/immich-app/immich-machine-learning:release
          container_name: immich-machine-learning
          restart: unless-stopped
          volumes:
            - model-cache:/cache
        redis:
          image: redis:7-alpine
          container_name: immich-redis
          restart: unless-stopped
        database:
          image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
          container_name: immich-db
          restart: unless-stopped
          environment:
            POSTGRES_USER: immich
            POSTGRES_PASSWORD: ${immich_db_password}
            POSTGRES_DB: immich
            POSTGRES_INITDB_ARGS: '--data-checksums'
          volumes:
            - /mnt/immich-data/postgres:/var/lib/postgresql/data
        cloudflared:
          image: cloudflare/cloudflared:latest
          container_name: cloudflared
          restart: unless-stopped
          command: tunnel run
          environment:
            TUNNEL_TOKEN: ${immich_cloudflared_token}
          depends_on:
            - immich-server
      volumes:
        model-cache:

  - path: /opt/immich/mount-data-and-start.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      # Runs as a single script (not separate runcmd entries) so `set -e`
      # actually aborts the boot before `docker compose up` if the data volume
      # never mounts — otherwise the db/upload bind-mounts below silently land
      # on the ephemeral boot disk and everything written is lost on the next
      # AMI-driven instance replacement.
      set -euo pipefail

      mkdir -p /mnt/immich-data

      ROOT_DISK=$(lsblk -no PKNAME "$(findmnt -no SOURCE /)" | head -1)
      DATA_DEV=""
      for i in $(seq 1 12); do
        for d in $(lsblk -dno NAME --nodeps -e7); do
          [ "$d" = "$ROOT_DISK" ] && continue
          DATA_DEV="/dev/$d"
          break
        done
        [ -n "$DATA_DEV" ] && break
        sleep 5
      done
      if [ -z "$DATA_DEV" ]; then
        echo "immich: no data disk found after 60s, aborting boot" >&2
        exit 1
      fi

      blkid "$DATA_DEV" || mkfs.ext4 -F "$DATA_DEV"
      DATA_UUID=$(blkid -s UUID -o value "$DATA_DEV")
      grep -q "$DATA_UUID" /etc/fstab || echo "UUID=$DATA_UUID /mnt/immich-data ext4 defaults,_netdev,nofail 0 2" >> /etc/fstab

      mount /mnt/immich-data
      if ! findmnt -M /mnt/immich-data >/dev/null; then
        echo "immich: /mnt/immich-data failed to mount, aborting before compose up" >&2
        exit 1
      fi

      mkdir -p /mnt/immich-data/upload /mnt/immich-data/postgres

      docker compose -f /opt/immich/docker-compose.yml up -d

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu
  - /opt/immich/mount-data-and-start.sh
