---
# Non-secret defaults for the Jellyfin Pi. Anything host-specific (drive UUID,
# SSH keys, timezone, addresses) belongs in inventory/host_vars/<host>.yml,
# which is gitignored — see inventory/host_vars/jellyfin-pi.example.yml.

# --- Base OS ---------------------------------------------------------------
pi_hostname: jellyfin-pi
pi_timezone: Etc/UTC
pi_base_packages:
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - rsync
  - htop
  - smartmontools
  - unattended-upgrades
  - apt-listchanges
  # deb822_repository parses and writes .sources files through python3-debian
  # and refuses to run without it. Installed here, in the base step, because
  # the Docker and Tailscale repositories are both declared with that module
  # later in the same run.
  - python3-debian
# Security updates only — Docker's and Tailscale's apt repos are deliberately
# left out of the origins pattern so a media server never reboots into an
# untested container runtime on its own.
# Empty disables the step. Raspberry Pi OS ships the Wi-Fi radio rfkill
# soft-blocked until a WLAN regulatory domain is set, so a headless Pi with no
# country configured has a working driver and an unusable radio.
pi_wifi_country: ''
# Jellyfin refuses to start with less than 2GiB free and its metadata and cache
# only grow, so provisioning stops short of a boot device that cannot sustain
# it rather than letting the service fail mysteriously weeks later.
pi_min_free_gib: 3
pi_unattended_upgrades_automatic_reboot: true
pi_unattended_upgrades_reboot_time: '04:00'

# --- Service user ----------------------------------------------------------
# The uid/gid are pinned, not system-assigned: they are baked into the file
# ownership on the external media drive, so a replacement Pi must recreate the
# same numbers or every existing file lands with a stale owner. Never change
# these without chown -R on the drive.
jellyfin_service_user: jellyfin
jellyfin_service_group: jellyfin
jellyfin_uid: 2000
jellyfin_gid: 2000

# --- SSH hardening ---------------------------------------------------------
ssh_allow_users:
  - '{{ ansible_user }}'
ssh_permit_root_login: 'no'
ssh_password_authentication: 'no'
ssh_max_auth_tries: 3

# --- Media library ---------------------------------------------------------
# The library lives on the boot device. /srv is where Debian puts data this
# host serves, and keeping it off /mnt means a drive mounted there later
# cannot shadow it. Size the boot card for the library: it shares the device
# with Jellyfin's metadata and transcode cache, which is what pi_min_free_gib
# guards.
media_library_dir: /srv/media/library

# --- Samba media share -----------------------------------------------------
# A writable SMB share of the library so media is added by dragging into
# Finder instead of composing an rsync command. The container's own mount of
# the same directory stays read-only; this writes to the host path.
samba_packages:
  - samba
  # Finder only lists a host in its sidebar if something advertises it.
  - avahi-daemon
samba_workgroup: WORKGROUP
samba_share_name: media
samba_share_path: '{{ media_library_dir }}'
# The Jellyfin service user doubles as the SMB login: it owns the library
# directory, so forcing writes to it is what keeps files arriving over the
# share readable by the container, and a second identity would buy no extra
# isolation over the same files.
samba_user: '{{ jellyfin_service_user }}'
# Home LAN plus the Tailscale CGNAT range (100.64.0.0/10), so the share
# follows the same reachability as Jellyfin itself. Narrow it per host if the
# LAN is not a /16.
samba_allowed_networks:
  - 192.168.0.0/16
  - 100.64.0.0/10
samba_advertise_mdns: true
samba_config_path: /etc/samba/smb.conf
samba_avahi_service_path: /etc/avahi/services/samba.service
samba_service_name: smbd
samba_password_path: /run/samba-password
# The password is only read when the Samba account does not exist yet, so
# routine converge runs need no Vault. Set this to rotate it on an existing
# account: pnpm jellyfin:provision -- --tags samba -e samba_reset_password=true
samba_reset_password: false

# --- Docker ----------------------------------------------------------------
docker_apt_key_url: https://download.docker.com/linux/debian/gpg
docker_apt_keyring_path: /etc/apt/keyrings/docker.asc
docker_apt_repo_url: https://download.docker.com/linux/debian
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
# Same rotation limits as infrastructure/local/docker-daemon-config.json.
docker_log_max_size: 10m
docker_log_max_file: '3'

# --- Tailscale -------------------------------------------------------------
# Codename must match the running OS - a bookworm keyring on a trixie host
# installs a repo apt will not resolve.
tailscale_apt_key_url: 'https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg'
tailscale_apt_keyring_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_apt_repo_url: https://pkgs.tailscale.com/stable/debian
tailscale_hostname: '{{ pi_hostname }}'
# Non-secret identifier, like the account/zone ids in variables.tf.
tailnet_domain: echidna-rohu.ts.net
tailscale_authkey_path: /run/tailscale-authkey

# --- Jellyfin --------------------------------------------------------------
jellyfin_stack_dir: /opt/jellyfin
jellyfin_config_dir: /opt/jellyfin/config
jellyfin_cache_dir: /var/cache/jellyfin
jellyfin_port: 8096
jellyfin_service_name: jellyfin-compose.service
jellyfin_published_server_url: 'http://{{ tailscale_hostname }}.{{ tailnet_domain }}:{{ jellyfin_port }}'
