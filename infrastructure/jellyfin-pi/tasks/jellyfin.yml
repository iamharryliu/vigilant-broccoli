---
# Config and cache stay on the Pi's internal storage: they are small, rebuilt
# from the library on demand, and keeping them off the external drive means a
# drive swap never drags a stale server identity along with it.
- name: Create the Jellyfin state directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ jellyfin_service_user }}'
    group: '{{ jellyfin_service_group }}'
    mode: '0750'
  loop:
    - '{{ jellyfin_stack_dir }}'
    - '{{ jellyfin_config_dir }}'
    - '{{ jellyfin_cache_dir }}'

- name: Install the Jellyfin compose file
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: '{{ jellyfin_stack_dir }}/docker-compose.yml'
    owner: root
    group: root
    mode: '0644'
  notify: Restart jellyfin

# The compose file is host-agnostic; everything host-shaped (uids, paths,
# timezone, published URL) arrives through this .env, which compose reads
# automatically from the working directory.
- name: Render the compose environment
  ansible.builtin.template:
    src: jellyfin.env.j2
    dest: '{{ jellyfin_stack_dir }}/.env'
    owner: root
    group: root
    mode: '0640'
  notify: Restart jellyfin

- name: Install the Jellyfin systemd unit
  ansible.builtin.template:
    src: jellyfin-compose.service.j2
    dest: '/etc/systemd/system/{{ jellyfin_service_name }}'
    owner: root
    group: root
    mode: '0644'
  notify: Restart jellyfin

- name: Enable Jellyfin at boot
  ansible.builtin.systemd_service:
    name: '{{ jellyfin_service_name }}'
    enabled: true
    state: started
    daemon_reload: true
