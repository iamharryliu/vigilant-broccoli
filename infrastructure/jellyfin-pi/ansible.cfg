[defaults]
inventory = inventory/hosts.yml
# result_format, not stdout_callback = yaml: the community.general.yaml
# callback was removed in community.general 12, and ansible-core refuses to
# start when it is named. This is the built-in replacement.
result_format = yaml
display_skipped_hosts = False
interpreter_python = auto_silent
# Facts are gathered once per run and reused by every task file.
gathering = smart

[ssh_connection]
pipelining = True
