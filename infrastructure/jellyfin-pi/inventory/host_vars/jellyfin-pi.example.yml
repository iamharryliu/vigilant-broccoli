---
# Copy to inventory/host_vars/jellyfin-pi.yml (gitignored). Only values that
# are per-host belong here — shared defaults live in
# group_vars/jellyfin_pi.yml. No secrets: the two this playbook needs — the
# Tailscale auth key and the Samba password — arrive through the TS_AUTHKEY and
# SMB_PASSWORD environment variables (provision.sh pulls both from Vault).

# Public keys allowed to SSH in as ansible_user. Password auth is disabled in
# the same run, so an empty list would lock the host out — preflight asserts it.
ssh_authorized_keys:
  - ssh-ed25519 AAAA... you@your-laptop

pi_timezone: America/Toronto

# The media library lives on the boot device at media_library_dir. Override
# it here to put it elsewhere:
# media_library_dir: /srv/media/library

# The SMB share allows the home LAN and the Tailscale CGNAT range by default.
# Narrow it here if the LAN is not a /16:
# samba_allowed_networks:
#   - 192.168.0.0/24
#   - 100.64.0.0/10
