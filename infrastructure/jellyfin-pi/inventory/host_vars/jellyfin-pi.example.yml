---
# Copy to inventory/host_vars/jellyfin-pi.yml (gitignored). Only values that
# are per-host belong here — shared defaults live in
# group_vars/jellyfin_pi.yml. No secrets: the Tailscale auth key is the only
# secret this playbook needs and it arrives through the TS_AUTHKEY environment
# variable (provision.sh pulls it from Vault).

# `lsblk -f` on the Pi, UUID column of the external media drive partition.
media_drive_uuid: 00000000-0000-0000-0000-000000000000
# Must match the drive's existing filesystem; the playbook never formats.
media_fs_type: ext4

# Public keys allowed to SSH in as ansible_user. Password auth is disabled in
# the same run, so an empty list would lock the host out — preflight asserts it.
ssh_authorized_keys:
  - ssh-ed25519 AAAA... you@your-laptop

pi_timezone: America/Toronto
