<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111111" />
    <title>Shell</title>
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="status" hidden></div>
      <div id="terminal"></div>
      <div id="toolbar" role="toolbar" aria-label="Terminal keys">
        <button data-key="enter">Enter</button>
        <button data-key="esc">Esc</button>
        <button data-key="tab">Tab</button>
        <button data-key="up">↑</button>
        <button data-key="down">↓</button>
        <button data-key="left">←</button>
        <button data-key="right">→</button>
        <button data-key="home">Home</button>
        <button data-key="end">End</button>
        <button data-key="pageUp">PgUp</button>
        <button data-key="pageDown">PgDn</button>
        <button data-action="scroll">Scroll</button>
        <button data-toggle="ctrl" aria-pressed="false">Ctrl</button>
        <button data-toggle="alt" aria-pressed="false">Alt</button>
        <button data-ctrl="c">^C</button>
        <button data-ctrl="d">^D</button>
        <button data-ctrl="z">^Z</button>
        <button data-action="paste">Paste</button>
      </div>
    </div>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
