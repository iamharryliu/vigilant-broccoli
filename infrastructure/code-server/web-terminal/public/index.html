<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111111" />
    <title>Shell</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="status" hidden></div>
      <div id="terminal"></div>
      <div id="toolbar" role="toolbar" aria-label="Terminal keys">
        <button data-action="keys" aria-label="All keys">☰</button>
        <button data-key="enter">Enter</button>
        <button data-key="pageUp">PgUp</button>
        <button data-key="pageDown">PgDn</button>
        <button data-sheet-only data-key="up">↑</button>
        <button data-sheet-only data-key="down">↓</button>
        <button data-sheet-only data-key="left">←</button>
        <button data-sheet-only data-key="right">→</button>
        <button data-sheet-only data-key="home">Home</button>
        <button data-sheet-only data-key="end">End</button>
        <button data-key="esc">Esc</button>
        <button data-sheet-only data-toggle="ctrl" aria-pressed="false">
          Ctrl
        </button>
        <button data-sheet-only data-toggle="alt" aria-pressed="false">
          Alt
        </button>
        <button data-ctrl="c">^C</button>
        <button data-sheet-only data-ctrl="d">^D</button>
        <button data-sheet-only data-ctrl="z">^Z</button>
        <button data-action="paste">Paste</button>
        <button data-sheet-only data-text="/clear">/clear</button>
        <button data-sheet-only data-text="/compact">/compact</button>
        <button data-sheet-only data-text="/status">/status</button>
        <button data-sheet-only data-text="/context">/context</button>
        <button data-sheet-only data-text="/model">/model</button>
        <button data-sheet-only data-text="/resume">/resume</button>
        <button data-sheet-only data-text="/usage">/usage</button>
        <button data-sheet-only data-text="/local-session-status">
          /local-session-status
        </button>
        <button data-sheet-only data-text="/local-session-retry-publish">
          /local-session-retry-publish
        </button>
        <button data-sheet-only data-text="/local-create-pr-claude">
          /local-create-pr-claude
        </button>
        <button data-sheet-only data-text="/local-update-pr">
          /local-update-pr
        </button>
      </div>
      <div
        id="keys-sheet"
        role="dialog"
        aria-modal="true"
        aria-label="All keys"
        hidden
      >
        <div id="keys-panel">
          <div id="keys-header">
            <span>All keys</span>
            <button data-action="close" aria-label="Close">✕</button>
          </div>
          <div id="keys-list"></div>
        </div>
      </div>
    </div>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/addon-fit.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
