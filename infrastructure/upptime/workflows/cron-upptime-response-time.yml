name: cron-upptime-response-time

on:
  schedule:
    - cron: '25 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [response_time]

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: upptime
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.UPPTIME_MONITORING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate staging UI monitor to Google Cloud
        id: staging-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STAGING_UI_MONITOR_WIF_PROVIDER }}
          service_account: ${{ vars.STAGING_UI_MONITOR_SERVICE_ACCOUNT }}
      - name: Fetch staging UI Access token
        id: staging-access
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        with:
          secrets: |-
            client_id:vigilant-broccoli/STAGING_UI_CF_ACCESS_CLIENT_ID
            client_secret:vigilant-broccoli/STAGING_UI_CF_ACCESS_CLIENT_SECRET
      - name: Remove Google credential file before running monitoring
        env:
          CREDENTIALS_FILE: ${{ steps.staging-auth.outputs.credentials_file_path }}
        run: rm -- "$CREDENTIALS_FILE"
      - name: Warm Fly services
        run: bash scripts/warm-fly.sh
      - name: Configure monitoring repository credentials
        env:
          GH_PAT: ${{ github.token }}
        run: git remote set-url origin "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
      - uses: upptime/uptime-monitor@8be193bbcb957a3a917d2bb16a0c96959778a889 # v1.44.1
        with:
          command: response-time
        env:
          STAGING_UI_CF_ACCESS_CLIENT_ID: ${{ steps.staging-access.outputs.client_id }}
          STAGING_UI_CF_ACCESS_CLIENT_SECRET: ${{ steps.staging-access.outputs.client_secret }}
          GH_PAT: ${{ github.token }}
      - uses: upptime/uptime-monitor@8be193bbcb957a3a917d2bb16a0c96959778a889 # v1.44.1
        with:
          command: summary
        env:
          GH_PAT: ${{ github.token }}
      - name: Set up graph runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install graph dependencies
        run: npm ci --prefix scripts/graphs --no-audit --no-fund --foreground-scripts
      - name: Generate README graphs and badge endpoints
        run: node scripts/graphs/node_modules/@upptime/graphs/dist/cli.js
        env:
          GH_PAT: ${{ github.token }}
      - name: Verify README assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for service in json.loads(Path('history/summary.json').read_text()):
              slug = service['slug']
              for metric in ('uptime', 'response-time'):
                  for period in ('', '-day', '-week', '-month', '-year'):
                      path = Path('api') / slug / f'{metric}{period}.json'
                      badge = json.loads(path.read_text())
                      assert badge['schemaVersion'] == 1 and badge['message'], path
              graph = Path('graphs') / slug / 'response-time-week.png'
              assert graph.read_bytes().startswith(b'\x89PNG\r\n\x1a\n'), graph
          PY
      - name: Publish README assets
        run: |
          git config user.name 'Upptime Bot'
          git config user.email 'upptime@koj.co'
          git add api graphs
          if ! git diff --cached --quiet; then
            git commit -m ':bento: Update graphs and badges [skip ci] [upptime]'
            git push origin HEAD:main
          fi
