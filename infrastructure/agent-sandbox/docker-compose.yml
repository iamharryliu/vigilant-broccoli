services:
  agent-sandbox:
    build: .
    image: vb-agent-sandbox
    container_name: vb-agent-sandbox
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN
      - GH_TOKEN
      - AGENT_GH_APP_ID
      - SANDBOX_FIREWALL
      - SANDBOX_ALLOWED_DOMAINS
    cap_add:
      - NET_ADMIN
      - NET_RAW
    init: true
    # Same caps as resource-limits.sh; see its header for why.
    mem_limit: ${SANDBOX_MEMORY:-4g}
    memswap_limit: ${SANDBOX_MEMORY:-4g}
    cpus: ${SANDBOX_CPUS:-4}
    ports:
      - '127.0.0.1:13000:3000'
      - '127.0.0.1:14200:4200'
      - '127.0.0.1:18080:8080'
    volumes:
      - agent_home:/home/agent

volumes:
  agent_home:
