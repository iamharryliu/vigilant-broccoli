# Applied by apply.sh once Argo CD's CRDs exist, so it stays outside the tree
# it syncs. Changes reach the cluster after they merge to main.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iamharryliu/vigilant-broccoli.git
    targetRevision: main
    path: infrastructure/local/k3s/manifests
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
