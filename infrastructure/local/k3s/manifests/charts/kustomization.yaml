apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# helm-controller runs each chart's install job in the HelmChart's own
# namespace with 32 CPU / 32G limits, which a namespace under a ResourceQuota
# rejects. kube-system has none.
namespace: kube-system
resources:
  - alloy.yaml
  - grafana.yaml
  - headlamp.yaml
  - loki.yaml
  - traefik-config.yaml
