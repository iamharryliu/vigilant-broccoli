# HelmChartConfig is how k3s overrides values of a chart it bundles; the name
# must match the bundled HelmChart.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
spec:
  valuesContent: |-
    providers:
      kubernetesIngress:
        # The manager and images Ingresses route to apps on the Mac through
        # ExternalName Services, which Traefik ignores by default.
        allowExternalNameServices: true
    # JSON access logs reach Loki as pod logs; the vb-manager-local-fastify dashboard
    # parses RequestHost, DownstreamStatus, Duration and RequestPath from them.
    logs:
      access:
        enabled: true
        format: json
    # The default buckets stop at 5s, so slower vb-manager-local-fastify requests pin
    # the dashboard's Prometheus p95 to 5.
    metrics:
      prometheus:
        buckets: '0.05,0.1,0.25,0.5,1,2.5,5,10,30,60'
