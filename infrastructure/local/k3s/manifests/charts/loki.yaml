apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: loki
spec:
  repo: https://grafana.github.io/helm-charts
  chart: loki
  version: 7.3.0
  targetNamespace: local-platform
  createNamespace: true
  # The chart defaults to the scalable read/write/backend topology with
  # memcached caches and a gateway; one filesystem-backed binary is enough here.
  valuesContent: |-
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: '2020-10-24'
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 720h
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
    singleBinary:
      replicas: 1
      persistence:
        size: 5Gi
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
