# Apps that run on the Mac, outside the cluster. k3d adds host.k3d.internal to
# CoreDNS, the cluster-side equivalent of host.docker.internal.
apiVersion: v1
kind: Service
metadata:
  name: local-manager-next
spec:
  type: ExternalName
  externalName: host.k3d.internal
  ports:
    - name: http
      port: 1337
---
apiVersion: v1
kind: Service
metadata:
  name: immich
spec:
  type: ExternalName
  externalName: host.k3d.internal
  ports:
    - name: http
      port: 2283
---
apiVersion: v1
kind: Service
metadata:
  name: job-hunt-next
spec:
  type: ExternalName
  externalName: host.k3d.internal
  ports:
    - name: http
      port: 4300
