# local-tls is created from infrastructure/local/certs by apply.sh, never committed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manager
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: local-platform-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - manager.vigilant-broccoli.app
      secretName: local-tls
  rules:
    - host: manager.vigilant-broccoli.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: local-manager-next
                port:
                  number: 1337
---
